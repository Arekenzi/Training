<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0D1014">
<title>Программа</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Программа">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0D1014;--surface:#14181E;--raise:#1A1F27;--line:#232A33;--line2:#2F3742;
--tx:#E9EDF2;--dim:#7C8794;--soft:#B4BDC7;--bone:#F2F5F8;
--chest:#D4453E;--back:#2E74D0;--legs:#1E9C67;--sh:#C98A16;--arms:#8B5CC4;--core:#5B6672;
--ok:#1E9C67;--alert:#D4453E;--hold:#C98A16;--r:10px;--rb:8px;--rc:4px}
body.light{--bg:#F2F4F7;--surface:#FFF;--raise:#F7F9FB;--line:#DFE4EA;--line2:#CDD5DE;
--tx:#111519;--dim:#616C79;--soft:#3A424C;--bone:#111519}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--tx);font-family:"Golos Text",system-ui,-apple-system,sans-serif;
font-size:15px;line-height:1.5;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
body.big{font-size:17px}
#shell{height:100%;display:flex;flex-direction:column}
#scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wrap{max-width:660px;margin:0 auto;padding:16px 14px 34px}
h1{font-weight:700;font-size:22px;line-height:1.16;letter-spacing:-.025em;margin:0}
h2{font-weight:600;font-size:17px;line-height:1.2;letter-spacing:-.02em;margin:0}
h3{font-weight:600;font-size:15px;line-height:1.25;letter-spacing:-.015em;margin:0}
body.big h1{font-size:25px}body.big h2{font-size:19px}body.big h3{font-size:17px}
.mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
.txt{font-size:14px;color:var(--soft);line-height:1.55}
.eyebrow{font-family:"JetBrains Mono",monospace;font-weight:500;text-transform:uppercase;
letter-spacing:.15em;font-size:9.5px;color:var(--dim);display:block;margin-bottom:6px}
.lbl{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:9px;text-transform:uppercase;
letter-spacing:.14em;color:var(--dim);margin:13px 0 4px;display:block}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.big-num{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:38px;line-height:1;letter-spacing:-.04em}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
padding:14px 15px;margin-bottom:8px;width:100%;text-align:left;color:inherit;font:inherit}
button.tile{cursor:pointer;transition:border-color .14s,background .14s}
button.tile:hover{border-color:var(--line2);background:var(--raise)}
button.tile:focus-visible,.btn:focus-visible,.chk:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.tile.ok{border-color:var(--ok)}
.day{position:relative;padding-left:19px;overflow:hidden}
.day:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--mark,var(--core))}
.tag{display:inline-flex;align-items:center;font-family:"JetBrains Mono",monospace;font-weight:500;
font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:var(--rc);
background:var(--raise);color:var(--dim);border:1px solid var(--line)}
.tag.ok{color:var(--ok);border-color:rgba(30,156,103,.45)}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.btn{font-family:"Golos Text",sans-serif;font-weight:600;font-size:13.5px;border-radius:var(--rb);
padding:11px 15px;cursor:pointer;border:1px solid var(--line2);background:transparent;color:var(--soft);transition:.14s}
.btn:hover{border-color:var(--dim);color:var(--tx)}
.btn.main{background:var(--bone);border-color:var(--bone);color:#0D1014}
body.light .btn.main{color:#FFF}
.btn.wide{flex:1}.btn.sm{padding:8px 11px;font-size:12.5px}
.btn.on{background:var(--raise);border-color:var(--bone);color:var(--tx)}
.pbar{height:3px;background:var(--line);overflow:hidden;margin:12px 0 14px}
.pbar i{display:block;height:100%;background:var(--bone);transition:width .3s}
.weekdots{display:flex;gap:6px;margin:0 0 14px}
.dot{flex:1;height:5px;background:var(--line)}
.dot.on{background:var(--bone)}
.stack{display:flex;gap:2px;height:9px;overflow:hidden;background:var(--line);margin:12px 0 5px}
.seg{transition:flex-grow .4s ease}
.stack-l{display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;
font-size:9.5px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
margin-bottom:8px;overflow:hidden;position:relative;padding-left:4px}
.ex:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--mark,var(--core))}
.ex.ok{border-color:var(--ok)}
.ex-h{padding:13px 14px;display:flex;gap:11px;align-items:flex-start;cursor:pointer}
.ex-n{width:24px;height:24px;flex:0 0 24px;border-radius:var(--rc);display:grid;place-items:center;
background:var(--raise);border:1px solid var(--line);font-family:"JetBrains Mono",monospace;
font-size:10.5px;color:var(--dim)}
.ex-n.ok{background:var(--ok);border-color:var(--ok);color:#0D1014}
.ex-b{padding:12px 14px 14px;border-top:1px solid var(--line)}
.hist{display:flex;align-items:flex-end;gap:2px;height:16px;margin-top:5px}
.hist span{width:4px;background:var(--line2)}
.hist span:last-child{background:var(--bone)}
.setshead{display:flex;gap:6px;align-items:center;margin:2px 0 7px}
.setshead span{font-family:"JetBrains Mono",monospace;font-size:8.5px;text-transform:uppercase;
letter-spacing:.1em;color:var(--dim)}
.set{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.set.warm input,.set.warm .set-n{opacity:.55}
.set-n{width:74px;flex:0 0 74px;font-family:"JetBrains Mono",monospace;font-size:9.5px;
color:var(--dim);line-height:1.2;text-transform:uppercase;letter-spacing:.03em}
.set.drop .set-n{color:var(--hold)}
input,select,textarea{background:var(--raise);border:1px solid var(--line);border-radius:var(--rb);
color:var(--tx);font-size:16px;padding:10px 9px;width:100%;min-width:0;
font-family:"JetBrains Mono",monospace}
input[type=text]{font-family:"Golos Text",sans-serif}
input[type=number],input.c{text-align:center}
input:focus,textarea:focus{outline:0;border-color:var(--bone);background:var(--surface)}
input::placeholder{color:var(--dim);opacity:.6}
.chk{width:44px;height:44px;flex:0 0 44px;border-radius:var(--rb);border:1px solid var(--line2);
background:var(--raise);cursor:pointer;display:grid;place-items:center;color:var(--dim);transition:.14s}
.chk.on{background:var(--ok);border-color:var(--ok);color:#0D1014}
.note,.warn,.good{border-radius:var(--rb);padding:11px 13px;font-size:13px;margin-top:10px;
line-height:1.5;border:1px solid;background:var(--raise)}
.note{border-color:rgba(46,116,208,.35);color:#9EC2F5}
.warn{border-color:rgba(212,69,62,.4);color:#F5A6A2}
.good{border-color:rgba(30,156,103,.4);color:#8FDCB6}
body.light .note{color:#1B4C8C}body.light .warn{color:#95241E}body.light .good{color:#0E5C3B}
.hr{height:1px;background:var(--line);margin:22px 0;border:0}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:20px;display:block;
line-height:1;letter-spacing:-.03em;margin-bottom:5px}
.frow{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.pl{font-family:"JetBrains Mono",monospace;font-size:11.5px;padding:5px 8px;border-radius:var(--rc);
background:var(--raise);border:1px solid var(--line2)}
.glass{width:100%;aspect-ratio:1;border-radius:var(--rb);border:1px solid var(--line2);background:var(--raise);
cursor:pointer;display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--dim)}
.glass.on{background:var(--back);border-color:var(--back);color:#fff}
.spark{width:100%;height:50px;display:block;margin-top:8px}
textarea{min-height:84px;font-size:12px}
.nav{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);display:flex;
padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;color:var(--dim);font-family:"JetBrains Mono",monospace;
font-size:8.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:10px 2px 9px;
cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;transition:color .14s}
.nav button.on{color:var(--tx)}
.nav button.on:after{content:"";position:absolute;top:0;width:28px;height:2px;background:var(--bone)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:square}
.timer{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line2);padding:10px 14px;display:none}
.timer.on{display:block}
.timer-in{max-width:660px;margin:0 auto;display:flex;align-items:center;gap:12px}
.tlbl{display:block;font-family:"JetBrains Mono",monospace;font-size:9px;text-transform:uppercase;
letter-spacing:.12em;color:var(--dim);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnum{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:22px;letter-spacing:-.03em;transition:.18s}
.tnum.hot{font-size:28px;color:var(--hold)}
.tnum.over{color:var(--alert)}
.tprog{flex:1;height:3px;background:var(--line);overflow:hidden}
.tfill{height:100%;background:var(--bone);width:100%;transition:width 1s linear}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.diag{background:var(--raise);border:1px solid var(--line);border-radius:var(--rb);
padding:10px 8px 4px;margin:12px 0 4px;color:var(--dim)}
.diag svg{width:100%;max-width:260px;height:auto;display:block;margin:0 auto}
.diag-t{font-family:"JetBrains Mono",monospace;font-size:8.5px;text-transform:uppercase;
letter-spacing:.14em;color:var(--dim);text-align:center;margin-bottom:4px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs><marker id="ar" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1 L9 5 L0 9 z" fill="currentColor"/></marker></defs></svg>
<div id="shell">
 <div id="scroll"><div class="wrap" id="app"></div></div>
 <div class="timer" id="timer"><div class="timer-in">
   <div style="flex:0 0 auto;min-width:96px">
     <span class="tlbl" id="tlbl">Отдых</span><span class="tnum" id="tnum">1:30</span>
   </div>
   <div class="tprog"><div class="tfill" id="tfill"></div></div>
   <button class="btn sm" id="tskip">Стоп</button>
 </div></div>
 <nav class="nav" id="nav"></nav>
</div>
<script>
const EX={
bp:{n:"Жим штанги лёжа",eq:"штанга, скамья со стойками",m:"Грудь целиком",st:"75 кг",f:0,alt:["flat_db","hammer_ch","inc_bb"],
why:"Основа силы верха тела: единственное движение, где грудь работает под действительно большим весом.",
t:"Хват на ширине плеч плюс ладонь с каждой стороны. Лопатки сведены и опущены в карман на весь подход, стопы плотно в полу. Гриф опускаешь к низу груди без отбива, локти под 45°. Жмёшь по слегка диагональной траектории назад к плечам.",
err:"Широкий хват и разведённые в стороны локти — прямой путь к боли в плече. Отбив грифа от груди. Отрыв таза от скамьи.",
feel:"Грудь должна тянуть в нижней точке. Если всё забирает передняя дельта — опусти локти ближе к корпусу и сведи лопатки сильнее."},
inc_bb:{n:"Жим штанги на наклонной 30°",eq:"штанга, наклонная скамья",m:"Верх груди",st:"55–60 кг",f:0,alt:["inc_db","hammer_ch","cross_up"],
why:"Верх груди — причина, по которой грудь выглядит плоской и висячей. Под штангой туда можно дать самый большой вес.",
t:"Угол ровно 30°, выше — работу забирает дельта. Гриф опускается к верху груди, ближе к ключицам. Лопатки сведены, локти 45°.",
err:"Слишком большой угол скамьи. Опускание грифа на середину груди вместо ключиц.",
feel:"Жжение должно идти под ключицами. Если чувствуешь только плечи — уменьшай угол."},
inc_db:{n:"Жим гантелей на наклонной 30°",eq:"гантели, регулируемая скамья",m:"Верх груди",st:"26–30 кг",f:0,alt:["inc_bb","hammer_ch","cross_up"],
why:"Гантели дают амплитуду больше штанги и грузят верх груди в растянутом положении, где мышца растёт лучше всего.",
t:"Лопатки сведены и прижаты. Локти под 45°, не разводить в стороны. Внизу опускаешь до ощутимого растяжения, вверху гантели не стукаешь и руки в замок не выпрямляешь.",
err:"Опускание гантелей слишком низко при больном плече. Стук гантелями вверху — теряется напряжение.",
feel:"В нижней точке грудь должна ощутимо тянуться."},
flat_db:{n:"Жим гантелей лёжа",eq:"гантели, скамья",m:"Середина груди",st:"30–34 кг",f:0,alt:["bp","hammer_ch","pec_deck"],
why:"Больше амплитуда, чем у штанги, и каждая сторона работает самостоятельно — уходит перекос.",
t:"Опускаешь до уровня груди, локти 45°, темп медленный. Внизу пауза без расслабления, вверху не сводишь гантели до касания.",
err:"Слишком быстрый негатив. Сведение гантелей вверху до стука.",
feel:"Напряжение по центру груди на протяжении всего подхода."},
hammer_ch:{n:"Жим в рычажном тренажёре",eq:"хаммер для груди",m:"Середина груди",st:"60–70 кг",f:1,alt:["pec_deck","flat_db","cross_dn"],
why:"Позволяет работать до полного отказа и делать дроп-сет без риска для плеча.",
t:"Рукояти на уровне середины груди, спина плотно к спинке, лопатки сведены. Негатив 3 секунды, пауза внизу без расслабления.",
err:"Слишком высокая посадка — нагрузка уходит в дельту. Помощь корпусом.",
feel:"К третьему подходу грудь должна гореть, а не плечи."},
dips:{n:"Отжимания на брусьях",eq:"брусья или гравитрон",m:"Низ груди, трицепс",st:"свой вес",f:0,alt:["dips_tri","cross_dn","hammer_ch"],
why:"Низ груди и трицепс одним движением — редкое сочетание, которое подтягивает грудь визуально вверх.",
t:"Корпус наклонён вперёд на 30°, так работает грудь. Опускаешься строго до угла 90° в локте и НЕ ниже: глубже плечо получает травмоопасную нагрузку.",
err:"Провал ниже 90° — главная причина боли в плече на брусьях. Вертикальный корпус переносит всё на трицепс.",
feel:"Растяжение по низу груди в нижней точке."},
cross_up:{n:"Сведения в кроссовере снизу вверх",eq:"кроссовер, нижние блоки",m:"Верх груди",st:"10–15 кг",f:1,alt:["pec_deck","cross_dn","inc_db"],
why:"Изоляция верха груди с постоянным напряжением — то, чего не даёт ни один жим.",
t:"Блоки внизу, корпус наклонён вперёд на 15°. Ведёшь руки по дуге снизу вверх к подбородку, кисти скрещиваются, пауза 1 секунда. Локти чуть согнуты и зафиксированы.",
err:"Сгибание и разгибание локтей превращает упражнение в жим. Слишком большой вес и раскачка корпусом.",
feel:"Сжатие в верхней внутренней части груди в точке скрещивания."},
cross_dn:{n:"Сведения в кроссовере сверху вниз",eq:"кроссовер, верхние блоки",m:"Низ и середина груди",st:"12–18 кг",f:1,alt:["pec_deck","cross_up","dips"],
why:"Другой угол — другие волокна. Добивает низ груди и держит напряжение там, где жимы его теряют.",
t:"Блоки вверху, сводишь руки перед собой на уровне пояса, в конце скрещиваешь. Пауза 1 секунда, корпус неподвижен.",
err:"Наклон корпуса вперёд по ходу подхода. Работа локтями вместо плечевого сустава.",
feel:"Сжатие по низу груди, как при позировании."},
pec_deck:{n:"Бабочка в тренажёре",eq:"тренажёр «бабочка»",m:"Грудь, добивка",st:"подбор",f:1,alt:["cross_up","cross_dn","hammer_ch"],
why:"Последнее упражнение на грудь: работаешь чисто до жжения, стабилизаторы не мешают.",
t:"Спина к спинке, локти на уровне плеч. Сводишь до касания, пауза 1 секунда, разводишь медленно до растяжения.",
err:"Слишком широкий стартовый угол при больном плече. Рывковое разведение.",
feel:"Постоянное жжение по всей груди без участия рук."},
pullup_w:{n:"Подтягивания с весом",eq:"турник, пояс",m:"Широчайшие, ширина",st:"свой вес → +5 кг",f:0,alt:["pullup_n","lat_w","lat_r"],
why:"Спина растёт от прогрессии веса так же, как грудь. Ты подтягиваешься 10+ раз — значит пора вешать пояс.",
t:"Хват шире плеч на две ладони. Из полного виса сначала опускаешь лопатки, потом тянешь локтями вниз-назад. Подбородок над перекладиной, негатив 2–3 секунды.",
err:"Раскачка корпусом и рывок. Неполное выпрямление рук внизу — теряется растяжение широчайших.",
feel:"Тяга должна ощущаться в подмышечной области и по бокам спины, а не в бицепсе."},
pullup_n:{n:"Подтягивания нейтральным хватом",eq:"турник с параллельными ручками",m:"Широчайшие, бицепс",st:"свой вес",f:0,alt:["pullup_w","lat_r","hammer_row"],
why:"Нейтральный хват мягче для плеча и сильнее включает бицепс.",
t:"Ладони смотрят друг на друга. Тянешь до касания грудью, локти вдоль корпуса. Внизу руки выпрямляешь полностью.",
err:"Подтягивание рывком за счёт ног.",feel:"Работа по низу широчайших и в бицепсе."},
db_row:{n:"Тяга гантели одной рукой",eq:"гантель, скамья",m:"Широчайшая",st:"30–36 кг",f:1,alt:["cable_row1","hammer_row","tbar"],
why:"Односторонняя работа выравнивает стороны и даёт самую длинную амплитуду для широчайшей.",
t:"Колено и одноимённая рука на скамье, спина параллельна полу и нейтральна. Три точки опоры снимают нагрузку с поясницы. Тянешь к поясу, локоть вдоль корпуса, вверху пауза 1 секунда, внизу полное растяжение.",

["Почему 7 упражнений, а не 15","Считаем честно: подход 45 секунд, отдых от 45 до 180, переход к тренажёру и подбор веса ещё пара минут. 15 упражнений — это 2 часа 45 минут в идеальном зале без очередей. Ты это проверил на себе. 7 упражнений плюс пресс дают 24–28 рабочих подходов и укладываются в 80–95 минут. Мышца не знает, сколько ты пробыл в зале, она знает объём и близость к отказу."],
["Почему две разные недели","Мышца растёт от двух разных стимулов: тяжёлый вес с малым числом повторов даёт силу и плотность, лёгкий вес с большим объёмом и коротким отдыхом — насыщение кровью и метаболический стресс. Если давать только первое, встают суставы и нервная система. Только второе — не растут веса. Поэтому недели чередуются: A тяжёлая, B лёгкая, и так по кругу."],

["Почему каждая мышца раз в неделю","При трёх тренировках выбор такой: либо каждая мышца дважды в неделю по 5–6 подходов, либо один раз по 10–12. Второе даёт более сильный стимул за занятие и позволяет собрать день логично — все жимы вместе, все тяги вместе. Разные упражнения каждую вторую неделю закрывают вопрос однообразия."],
["Про твои слабые места","Узкие плечи — средняя дельта работает в обе недели, суммарно 8 подходов. Незаметные трапеции — шраги в обе недели. Тонкие руки — бицепс и трицепс получают по 6–7 подходов плюс косвенную работу во всех тягах и жимах. Тонкие запястья — предплечья отдельным упражнением каждую неделю. Спина не широкая — подтягивания и вертикальные тяги стоят первыми, когда ты свежий. Жир на животе и пояснице убирается только дефицитом калорий, упражнениями на пресс — нет."],
["Про жир и рельеф одновременно","Ты хочешь и убрать жир, и набрать мышцы. В чистом виде это возможно только у новичков и на возврате формы — у тебя стаж 1–3 года, значит идёт медленно. Стратегия такая: умеренный дефицит, много белка, тяжёлые веса. Мышцы при этом не растут быстро, но и не уходят, а жир снижается — визуально это и есть рельеф."]];

["Колено","Уменьши глубину в жиме ногами и гакк-приседе до угла без боли. Разгибания ног — в верхней половине амплитуды с малым весом. Обязательно грузи бицепс бедра: он стабилизирует колено.","Не приседай глубоко под нагрузкой, не бегай, не прыгай, не терпи острую боль ради повтора.","К врачу: колено отекает, щёлкает с болью, подгибается, или боль держится две недели."],

const DBAPI=(function(){
 let ok=true;try{localStorage.setItem("__p","1");localStorage.removeItem("__p");}catch(e){ok=false;}
 const mem={};
 return{ok:ok,
  async get(k){let v;try{v=ok?localStorage.getItem(k):(k in mem?mem[k]:null);}catch(e){v=null;}
   return (v===null||v===undefined)?null:{key:k,value:v};},
  async set(k,v){try{if(ok)localStorage.setItem(k,v);else mem[k]=v;}catch(e){return null;}return{key:k,value:v};},
  async delete(k){try{if(ok)localStorage.removeItem(k);else delete mem[k];}catch(e){}return{key:k,deleted:true};}};
})();
const KEY="trener:v4";
let DB={start:null,wk:0,kcalAdj:0,swap:{},log:{},done:{},hist:[],bw:[],fail:{},notes:{},
 food:{},water:{},check:{},menu:0,theme:"dark",big:false,pause:false};
let SMODE=DBAPI.ok?"ok":"none";
function guard(){
 if(!(DB.menu>=0&&DB.menu<MENUS.length))DB.menu=0;
 ["done","log","fail","notes","food","water","check","swap"].forEach(k=>{
  if(!DB[k]||typeof DB[k]!=="object"||Array.isArray(DB[k]))DB[k]={};});
 ["hist","bw"].forEach(k=>{if(!Array.isArray(DB[k]))DB[k]=[];});}
async function load(){
 if(SMODE==="none"){guard();return;}
 try{const r=await DBAPI.get(KEY);if(r&&r.value)DB=Object.assign(DB,JSON.parse(r.value));}catch(e){}
 if(!DB.start){try{const o=await DBAPI.get("trener:v3");
  if(o&&o.value){const q=JSON.parse(o.value);
   DB.log=q.log||{};DB.hist=q.hist||[];DB.bw=q.bw||[];DB.start=q.start||null;DB.kcalAdj=q.kcalAdj||0;}}catch(e){}}
 guard();}
async function save(){if(SMODE==="none")return;
 for(let i=0;i<2;i++){try{const r=await DBAPI.set(KEY,JSON.stringify(DB));
  if(r!==null){if(SMODE==="err"){SMODE="ok";render();}return;}}catch(e){}
  if(i===0)await new Promise(r=>setTimeout(r,600));}
 if(SMODE!=="err"){SMODE="err";render();}}
const today=()=>new Date().toISOString().slice(0,10);
function weekNow(){if(!DB.start)return 1;
 return Math.max(1,Math.floor((Date.now()-new Date(DB.start+"T00:00:00").getTime())/864e5/7)+1);}
function wIdx(){return DB.wk===undefined?((weekNow()-1)%2):DB.wk;}
function setWk(i){DB.wk=i;save();render();}
function W(){return WEEKS[wIdx()];}
function bw(){return DB.bw.length?DB.bw[DB.bw.length-1].w:102;}
function trend(){const b=DB.bw;if(b.length<3)return null;
 const f=b[0],l=b[b.length-1],days=(new Date(l.d)-new Date(f.d))/864e5;
 if(days<14)return null;return{rate:(l.w-f.w)/days*7,days:Math.round(days)};}
function addKcal(v){DB.kcalAdj=(DB.kcalAdj||0)+v;save();render();}
function target(){const w=bw(),bmr=10*w+6.25*190-5*35+5,tdee=bmr*1.42;
 const k=Math.round(tdee*0.8/10)*10+(DB.kcalAdj||0),p=Math.round(w*1.9/5)*5,f=Math.round(w*0.8/5)*5;
 return{k,p,f,c:Math.round((k-p*4-f*9)/4),tdee:Math.round(tdee)};}
function swapOf(id){return DB.swap[id]||id;}
function itemsFor(di){return W().days[di].items.map(x=>Object.assign({},x,{id:swapOf(x.id),orig:x.id}));}
function lastLog(id){const l=DB.log[id];return l&&l.length?l[l.length-1]:null;}
function bestOf(id){const l=DB.log[id];if(!l)return 0;let m=0;
 l.forEach(s=>s.sets.forEach(x=>{if(+x.w>m)m=+x.w;}));return m;}

 if((DB.fail[it.id]||0)>=2)return{k:"down",t:"Дважды не добрал нижнюю границу. Сними 10 % и иди вверх заново."};

function setRow(it,k,lbl,warm,drop,prev,i){
 const st=(session.sets[it.id]||{})[k]||{},pw=prev&&prev.sets.filter(s=>!s.warm)[i];
 let hint=warm?"лёгкий":(pw&&pw.w)||"кг";
 if(warm){const cur=(session.sets[it.id]||{})["s0"],base=(cur&&+cur.w)||(pw&&+pw.w)||0;
  if(base)hint=Math.round(base*(i===0?0.4:0.65)/2.5)*2.5+" кг";}
 return `<div class="set ${warm?"warm":""} ${drop?"drop":""}"><span class="set-n">${lbl}</span>
 <input type="number" inputmode="decimal" placeholder="${hint}" value="${st.w||""}" onchange="setV('${it.id}','${k}','w',this.value)">
 <input type="number" inputmode="numeric" placeholder="повт" value="${st.r||""}" onchange="setV('${it.id}','${k}','r',this.value)">
 <button class="chk ${st.ok?"on":""}" onclick="tick('${it.id}','${k}',${it.rest},'${k}')" aria-label="Подход выполнен">${CHECK}</button></div>`;}
function setV(id,k,f,v){session.sets[id]=session.sets[id]||{};session.sets[id][k]=session.sets[id][k]||{};session.sets[id][k][f]=v;}
function tick(id,k,rest,label){session.sets[id]=session.sets[id]||{};session.sets[id][k]=session.sets[id][k]||{};
 const c=session.sets[id][k];c.ok=!c.ok;
 if(c.ok){const nm=EX[id]?EX[id].n:"";
  const num=k[0]==="s"?("подход "+(+k.slice(1)+1)):k[0]==="w"?"разминка":"дроп-сет";
  startTimer(rest,nm,num);if(navigator.vibrate)navigator.vibrate(30);}
 render();}
function tg(n){open.has(n)?open.delete(n):open.add(n);render();}
function repPrev(id){const p=lastLog(id);if(!p)return;session.sets[id]=session.sets[id]||{};
 p.sets.filter(s=>!s.warm&&!s.drop).forEach((s,i)=>{session.sets[id]["s"+i]={w:s.w,r:s.r};});render();}
function plate(id,n){const st=session.sets[id]||{};let t=0;
 for(const k in st)if(k[0]==="s"&&st[k].w){t=+st[k].w;break;}
 const el=document.getElementById("ex"+n);if(!el)return;
 if(!t){el.innerHTML='<div class="note">Впиши вес в рабочий подход — посчитаю блины.</div>';return;}
 let per=(t-20)/2,out=[],rest=per;
 [25,20,15,10,5,2.5,1.25].forEach(p=>{while(rest>=p-0.01){out.push(p);rest=+(rest-p).toFixed(2);}});
 el.innerHTML=per<=0?`<div class="note">${t} кг меньше грифа. Бери гантели или лёгкий гриф.</div>`:

function finEx(id,n){const st=session.sets[id]||{};st.fin=true;session.sets[id]=st;
 const it=itemsFor(session.di).find(x=>x.id===id);
 if(it&&!st.logged){const arr=[];
  for(let i=0;i<(it.w||0);i++){const c=st["w"+i];if(c&&(c.w||c.r))arr.push({w:c.w,r:c.r,warm:1});}
  for(let i=0;i<it.s;i++){const c=st["s"+i];if(c&&(c.w||c.r))arr.push({w:c.w,r:c.r});}
  if(st.d0&&(st.d0.w||st.d0.r))arr.push({w:st.d0.w,r:st.d0.r,drop:1});
  if(arr.length){st.logged=1;DB.log[id]=DB.log[id]||[];DB.log[id].push({d:today(),sets:arr});
   const wk=arr.filter(s=>!s.warm&&!s.drop);
   DB.fail[id]=(wk.length&&wk.every(s=>+s.r<it.lo))?(DB.fail[id]||0)+1:0;save();}}
 open.delete(n);
 const tot=itemsFor(session.di);
 for(let k=n+1;k<tot.length;k++){const nx=tot[k];
  if(!(session.sets[nx.id]&&session.sets[nx.id].fin)){open.add(k);break;}}
 render();}

function finishW(){const di=session.di,w=weekNow(),it=itemsFor(di);

 let ton=0,prs=[];
 it.forEach(x=>{const st=session.sets[x.id]||{};
  Object.keys(st).forEach(k=>{const c=st[k];if(c&&c.w&&c.r)ton+=(+c.w)*(+c.r);});
  const b=bestOf(x.id);let cur=0;Object.keys(st).forEach(k=>{if(st[k]&&+st[k].w>cur)cur=+st[k].w;});
  if(cur>b&&b>0)prs.push(EX[x.id].n+" — "+cur+" кг");});
 const dur=Math.round((Date.now()-session.t0)/60000);
 const prev=DB.hist.filter(h=>h.day===di).slice(-1)[0];

 ${dur>110?'<div class="warn">Больше 110 минут. Если это из-за очередей к тренажёрам — используй кнопку «Заменить» прямо в упражнении, а не жди.</div>':""}

 <div class="dim mono" style="font-size:11px;margin-top:3px">${items.length?`${t.k} ккал · Б${t.p} Ж${t.f} У${t.c}`:"не заполнен"}</div></div>
 <span class="dim">${o?"▴":"▾"}</span></div>
 ${o?`<div class="ex-b">
 ${items.length?items.map((x,n)=>{const p=F[x[0]];if(!p)return "";const m=p.unit?x[1]:x[1]/100;
  return `<div class="frow"><span style="flex:1;font-size:13.5px">${p.n}</span>
  <input type="number" class="c" style="width:66px;padding:7px" value="${x[1]}" onchange="editG(${i},${n},this.value)">
  <span class="dim mono" style="font-size:10.5px;width:42px;text-align:right">${Math.round(p.k*m)}</span>
  <button class="btn sm" onclick="swapFood(${i},${n})">⇄</button>
  <button class="btn sm" onclick="delG(${i},${n})">×</button></div>`;}).join(""):'<div class="dim" style="font-size:14px">Пока пусто.</div>'}
 <div id="sw${i}"></div>
 <div class="row" style="margin-top:10px">
 <button class="btn sm" onclick="loadMeal(${i})">${items.length?"Заменить на меню":"Взять из меню"}</button>
 <button class="btn sm" onclick="sub=sub==='a${i}'?null:'a${i}';render()">Добавить продукт</button>
 ${items.length?`<button class="btn sm" onclick="clearMeal(${i})">Очистить</button>`:""}</div>
 ${sub==="a"+i?addFood(i):""}
 <div class="note"><b>В меню «${MENUS[DB.menu].n}»:</b><br>
 ${menu.map(([id,g])=>`${F[id].n} — ${g} ${F[id].unit?"порц":"г"}`).join("<br>")}<br><b>${mt.k} ккал · Б${mt.p}</b></div>
 </div>`:""}</div>`;}

function swapFood(meal,idx){const cur=dayFood()[meal][idx],p=F[cur[0]];if(!p)return;
 const kcal=(p.unit?cur[1]:cur[1]/100)*p.k;
 const pool=Object.keys(F).filter(a=>a!==cur[0]&&F[a].g===p.g&&F[a].k>0)
  .map(a=>({id:a,d:Math.abs(F[a].k-p.k)})).sort((x,y)=>x.d-y.d).slice(0,14);
 document.getElementById("sw"+meal).innerHTML=`<div class="note"><b>Заменить «${p.n}»</b>
 <div class="dim" style="font-size:11.5px;margin:5px 0 9px">Граммовка пересчитается так, чтобы калорийность осталась прежней — ${Math.round(kcal)} ккал.</div>
 ${pool.map(o=>{const x=F[o.id],g=x.unit?Math.max(1,Math.round(kcal/x.k)):Math.round(kcal/x.k*100/5)*5;
 return `<div class="frow"><span style="flex:1;font-size:13px">${x.n}<br>
 <span class="dim mono" style="font-size:10.5px">${g} ${x.unit?"порц":"г"} · Б${Math.round(x.p*(x.unit?g:g/100))} Ж${Math.round(x.f*(x.unit?g:g/100))} У${Math.round(x.c*(x.unit?g:g/100))}</span></span>
 <button class="btn sm" onclick="doFoodSwap(${meal},${idx},'${o.id}',${g})">Взять</button></div>`;}).join("")}
 <button class="btn sm" style="margin-top:9px" onclick="document.getElementById('sw${meal}').innerHTML=''">Закрыть</button></div>`;}
function doFoodSwap(meal,idx,id,g){dayFood()[meal][idx]=[id,g];save();render();}

function menuScreen(){const t=calc(MENUS[DB.menu].m.flat()),T=target();
 return `<div class="tile"><b style="font-size:14.5px">Меню на день — ${MENUS.length} варианта</b>
 <div class="row" style="margin:10px 0">${MENUS.map((m,i)=>
 `<button class="btn sm ${DB.menu===i?"on":""}" onclick="setMenu(${i})">${m.n}</button>`).join("")}</div>
 <div class="txt">${MENUS[DB.menu].d}</div>
 ${MENUS[DB.menu].m.map((meal,i)=>{const mt=calc(meal);
 return `<div style="margin-top:12px"><span class="lbl">${MEALT[i]}</span>
 ${meal.map(([id,g])=>`<div class="frow"><span style="flex:1;font-size:13px">${F[id].n}</span>
 <span class="mono dim" style="font-size:11.5px">${g} ${F[id].unit?"порц":"г"}</span></div>`).join("")}
 <div class="dim mono" style="font-size:10.5px;margin-top:5px">${mt.k} ккал · Б${mt.p}</div></div>`;}).join("")}
 <div class="good" style="margin-top:12px"><b>Итого: ${t.k} ккал · Б${t.p} Ж${t.f} У${t.c}</b><br>
 Цель: ${T.k} ккал · Б${T.p} Ж${T.f} У${T.c}. Разница ${t.k-T.k>0?"+":""}${t.k-T.k} ккал.</div>
 <div class="note">Веса для ГОТОВОГО продукта. В дневник ничего не попадает, пока не нажмёшь «Взять из меню».</div></div>`;}
function setMenu(i){DB.menu=i;save();render();}
function tgMeal(i){mealOpen=mealOpen===i?null:i;if(sub&&sub[0]==="a")sub=null;render();}
function loadMeal(i){dayFood()[i]=MENUS[DB.menu].m[i].map(x=>x.slice());save();render();}
function clearMeal(i){dayFood()[i]=[];save();render();}
function fRows(ids,meal){return ids.map(id=>`<div class="frow"><span style="flex:1;font-size:13.5px">${F[id].n}
 <span class="dim mono" style="font-size:10.5px"> ${F[id].k} ккал</span></span>
 <input type="number" class="c" id="g_${id}" placeholder="${F[id].unit?"порц":"г"}" style="width:62px;padding:7px">
 <button class="btn sm" onclick="addF('${id}',${meal})">+</button></div>`).join("");}
function addFood(meal){const ids=Object.keys(F).filter(id=>F[id].n.toLowerCase().includes(q.toLowerCase()));
 return `<div class="tile" style="margin-top:10px"><input type="text" placeholder="Поиск продукта" value="${q}" oninput="q=this.value;fList(${meal})">
 <div id="fl" style="max-height:260px;overflow:auto;margin-top:8px">${fRows(ids,meal)}</div></div>`;}
function fList(meal){const ids=Object.keys(F).filter(id=>F[id].n.toLowerCase().includes(q.toLowerCase()));
 const el=document.getElementById("fl");if(el)el.innerHTML=fRows(ids,meal);}
function addF(id,meal){const el=document.getElementById("g_"+id),v=el&&el.value;if(!v)return;
 dayFood()[meal].push([id,+v]);save();render();}
function editG(m,i,v){dayFood()[m][i][1]=+v;save();render();}
function delG(m,i){dayFood()[m].splice(i,1);save();render();}
function setWater(n){const d=today();DB.water[d]=DB.water[d]===n?n-1:n;save();render();}
function tCheck(k){const d=today();DB.check[d]=DB.check[d]||{};DB.check[d][k]=!DB.check[d][k];save();render();}

function foodBase(){const ids=Object.keys(F)
 .filter(id=>F[id].n.toLowerCase().includes(fq.toLowerCase()))
 .filter(id=>fG===""||FG[F[id].g]===fG);
 return `<div class="tile"><b style="font-size:14.5px">Справочник продуктов — ${Object.keys(F).length} позиций</b>
 <div class="dim" style="font-size:11.5px;margin:5px 0 9px">Значения на 100 г. Мясо, рыба и крупы — в готовом виде.</div>
 <input type="text" placeholder="Поиск: курица, рис, творог…" value="${fq}" oninput="fq=this.value;render()">
 <div class="row" style="margin:9px 0;gap:5px">
 <button class="btn sm ${!fG?"on":""}" onclick="fG='';render()">Все</button>
 ${FG.map(g=>`<button class="btn sm ${fG===g?"on":""}" onclick="fG='${g}';render()">${g}</button>`).join("")}</div>
 <div style="max-height:420px;overflow:auto">
 <div class="frow" style="border-bottom:1px solid var(--line2)">
 <span style="flex:1" class="lbl" >продукт</span><span class="lbl" style="width:44px;text-align:right">ккал</span>
 <span class="lbl" style="width:34px;text-align:right">Б</span><span class="lbl" style="width:34px;text-align:right">Ж</span>
 <span class="lbl" style="width:34px;text-align:right">У</span></div>
 ${ids.map(id=>{const x=F[id];return `<div class="frow">
 <span style="flex:1;font-size:13.5px">${x.n}${x.unit?' <span class="dim" style="font-size:10.5px">(порция)</span>':""}</span>
 <span class="mono" style="width:44px;text-align:right;font-size:12px">${x.k}</span>
 <span class="mono dim" style="width:34px;text-align:right;font-size:12px">${x.p}</span>
 <span class="mono dim" style="width:34px;text-align:right;font-size:12px">${x.f}</span>
 <span class="mono dim" style="width:34px;text-align:right;font-size:12px">${x.c}</span></div>`;}).join("")}
 </div></div>`;}

function shopList(){const agg={};
 MENUS[DB.menu].m.flat().forEach(([id,g])=>{const x=F[id];
  agg[id]=(agg[id]||0)+(x.unit?g:Math.round(g*(x.raw||1)))*7;});
 return `<div class="tile"><b style="font-size:14.5px">Покупки на неделю — «${MENUS[DB.menu].n}»</b>
 <div class="dim" style="font-size:11.5px;margin:6px 0 10px">Пересчитано в сырой вес.</div>
 ${Object.keys(agg).map(id=>{const x=F[id],a=agg[id];
 const d=!x.unit&&a>=1000?(Math.round(a/100)/10)+" кг":a+(x.unit?" порц":" г");
 return `<div class="frow"><span style="flex:1;font-size:13.5px">${x.n}</span>
 <span class="mono dim" style="font-size:12px">${d}</span></div>`;}).join("")}
 <div class="note">Готовь дважды в неделю: воскресенье и среда.</div></div>`;}

/* ================= ПРОГРЕСС ================= */
function spark(v,c){if(v.length<2)return"";const w=300,h=50,mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;
 return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${
 v.map((x,i)=>`${i/(v.length-1)*w},${h-4-((x-mn)/r)*(h-10)}`).join(" ")}" fill="none" stroke="${c}" stroke-width="2"/></svg>`;}
function volume(){const v={};
 WEEKS.forEach(wk=>wk.days.forEach(d=>d.items.forEach(it=>{const e=EX[swapOf(it.id)];if(!e)return;
  const g=grp(e);v[g]=(v[g]||0)+it.s;})));
 return v;}
function vProg(){const b=DB.bw.map(x=>x.w),ids=Object.keys(DB.log),vol=volume();
 app.innerHTML=banner()+`<div class="head"><div><span class="eyebrow">Прогресс</span><h1>Цифры</h1></div></div>
 <div class="grid3" style="margin-bottom:12px">
 <div class="stat"><b>${DB.hist.length}</b><span class="dim" style="font-size:11.5px">тренировок</span></div>
 <div class="stat"><b>${weekNow()}</b><span class="dim" style="font-size:11.5px">неделя</span></div>
 <div class="stat"><b>${DB.hist.reduce((a,h)=>a+(h.prs||0),0)}</b><span class="dim" style="font-size:11.5px">рекордов</span></div></div>
 <div class="tile"><b style="font-size:14.5px">Вес тела</b>
 <div class="row" style="margin-top:8px"><input type="number" id="bwIn" placeholder="кг" style="flex:1">
 <button class="btn sm" onclick="addBw()">Записать</button></div>
 ${b.length?`<div class="dim mono" style="font-size:11.5px;margin-top:8px">${b[0]} → ${b[b.length-1]} кг (${(b[b.length-1]-b[0]).toFixed(1)})</div>${spark(b,"#F2F5F8")}`:""}</div>
 ${ids.length?`<h3 style="margin:16px 0 8px">Рост весов</h3>
 ${ids.map(id=>{const l=DB.log[id],mx=l.map(s=>Math.max(...s.sets.filter(x=>!x.warm).map(x=>+x.w||0)));
 const d=mx[mx.length-1]-mx[0];
 return `<div class="tile"><div class="row" style="justify-content:space-between">
 <b style="font-size:14px">${EX[id]?EX[id].n:id}</b>
 ${d>0?`<span class="tag ok">+${d} кг</span>`:'<span class="tag n">—</span>'}</div>
 ${spark(mx,"#1E9C67")}</div>`;}).join("")}`:""}
 ${DB.hist.length?`<h3 style="margin:16px 0 8px">История</h3>
 ${DB.hist.slice().reverse().slice(0,15).map(h=>`<div class="tile" style="padding:12px">
 <div class="row" style="justify-content:space-between"><b style="font-size:13.5px">${WEEKS[0].days[h.day].t.split(" · ")[0]}</b>
 <span class="tag n mono">${h.d}</span></div>
 <div class="dim mono" style="font-size:11px;margin-top:4px">неделя ${h.wk||"?"} · ${h.dur} мин · ${Math.round(h.ton/1000*10)/10} т</div></div>`).join("")}`:""}`;}
function addBw(){const v=document.getElementById("bwIn").value;if(!v)return;
 DB.bw.push({d:today(),w:+v});save();render();}

/* ================= СПРАВКА ================= */
function vRef(){const ids=Object.keys(EX)
 .filter(id=>(EX[id].n+" "+EX[id].m+" "+EX[id].eq).toLowerCase().includes(q.toLowerCase()))
 .filter(id=>!gF||grp(EX[id])===gF);
 app.innerHTML=banner()+`<div class="head"><div><span class="eyebrow">Справка</span>
 <h1>${sub==="pain"?"Если болит":sub==="why"?"Почему так":sub==="gloss"?"Термины":"Упражнения"}</h1></div></div>
 <div class="row" style="margin-bottom:12px;gap:5px">
 <button class="btn sm ${!sub?"on":""}" onclick="sub=null;render()">Упражнения</button>
 <button class="btn sm ${sub==="why"?"on":""}" onclick="sub='why';render()">Почему так</button>
 <button class="btn sm ${sub==="pain"?"on":""}" onclick="sub='pain';render()">Если болит</button>
 <button class="btn sm ${sub==="gloss"?"on":""}" onclick="sub='gloss';render()">Термины</button></div>
 ${sub==="pain"?PAIN.map(([z,a,b,c])=>`<div class="tile"><h3>${z}</h3><div class="txt" style="margin-top:7px">${a}</div>
  <div class="warn">${b}</div><div class="note">${c}</div></div>`).join("")
 :sub==="why"?WHY.map(([n,t])=>`<div class="tile"><b style="font-size:14.5px">${n}</b><div class="txt" style="margin-top:6px">${t}</div></div>`).join("")
 :sub==="gloss"?GLOSS.map(([k,v])=>`<div class="tile" style="padding:13px"><b style="font-size:14px">${k}</b>
  <div class="txt" style="margin-top:5px">${v}</div></div>`).join("")
 :`<input type="text" placeholder="Поиск: жим, спина, гантели…" value="${q}" oninput="q=this.value;render()" style="margin-bottom:9px">
 <div class="row" style="margin-bottom:12px;gap:5px">
 <button class="btn sm ${!gF?"on":""}" onclick="gF='';render()">Все ${Object.keys(EX).length}</button>
 ${GRP.map(([g])=>{const c=Object.keys(EX).filter(i=>grp(EX[i])===g).length;
 return c?`<button class="btn sm ${gF===g?"on":""}" onclick="gF='${g}';render()">${g} ${c}</button>`:"";}).join("")}</div>
 ${ids.length?ids.map(id=>{const e=EX[id];return `<div class="ex" style="--mark:${GCOL[grp(e)]||"var(--core)"}">
 <div class="ex-h" onclick="tgR('${id}')"><span class="ex-n">·</span>
 <div style="flex:1"><h3>${e.n}</h3><div class="dim" style="font-size:12px;margin-top:2px">${e.m} · ${e.eq}</div></div>
 <span class="dim">▾</span></div>
 <div class="ex-b" id="r_${id}" style="display:none">
 ${diagram(e)}
 <div class="lbl">Зачем</div><div class="txt">${e.why}</div>
 <div class="lbl">Техника</div><div class="txt">${e.t}</div>
 <div class="lbl">Ошибки</div><div class="txt">${e.err||"—"}</div>
 <div class="lbl">Как понять, что работает мышца</div><div class="txt">${e.feel||"—"}</div>
 <div class="lbl">Стартовый вес</div><div class="txt">${e.st}</div></div></div>`;}).join(""):'<p class="dim">Ничего не найдено.</p>'}`}`;}
function tgR(id){const e=document.getElementById("r_"+id);if(e)e.style.display=e.style.display==="none"?"block":"none";}

/* ================= ЕЩЁ ================= */
function vMore(){const T=target();
 app.innerHTML=banner()+`<div class="head"><div><span class="eyebrow">Настройки</span><h1>Ещё</h1></div></div>
 <div class="tile"><b style="font-size:14.5px">Вид</b>
 <div class="row" style="margin-top:9px">
 <button class="btn sm ${DB.theme==="dark"?"on":""}" onclick="setTheme('dark')">Тёмная</button>
 <button class="btn sm ${DB.theme==="light"?"on":""}" onclick="setTheme('light')">Светлая</button>
 <button class="btn sm ${DB.big?"on":""}" onclick="DB.big=!DB.big;save();render()">Крупный шрифт</button></div></div>
 <div class="tile"><b style="font-size:14.5px">Норма калорий</b>
 <div class="txt" style="margin-top:6px">Расход ${T.tdee} ккал, цель ${T.k}${DB.kcalAdj?` (поправка ${DB.kcalAdj>0?"+":""}${DB.kcalAdj})`:""}.
 Формула ошибается на 200–300 ккал. Правило: вес стоит две недели — убавляй, уходит быстрее килограмма — добавляй.</div>
 <div class="row" style="margin-top:10px"><button class="btn sm" onclick="addKcal(-100)">−100</button>
 <button class="btn sm" onclick="addKcal(100)">+100</button>
 <button class="btn sm" onclick="DB.kcalAdj=0;save();render()">Сбросить</button></div></div>
 ${Object.keys(DB.swap).length?`<div class="tile"><b style="font-size:14.5px">Твои замены упражнений</b>
 ${Object.keys(DB.swap).map(o=>`<div class="frow"><span style="flex:1;font-size:13px">${EX[o]?EX[o].n:o} → <b>${EX[DB.swap[o]]?EX[DB.swap[o]].n:DB.swap[o]}</b></span>
 <button class="btn sm" onclick="doSwap('${o}','')">Вернуть</button></div>`).join("")}</div>`:""}
 <div class="tile"><b style="font-size:14.5px">Данные</b>
 <div class="row" style="margin-top:9px"><button class="btn sm" onclick="expTxt()">Скопировать текстом</button>
 <button class="btn sm" onclick="bkp()">Резервная копия</button><button class="btn sm" onclick="rstUI()">Восстановить</button></div>
 <div id="box" style="margin-top:10px"></div>
 <div class="note">Раз в пару недель делай копию и вставляй текст в «Заметки».</div></div>`;}
function setTheme(t){DB.theme=t;save();render();}
function expTxt(){let t="ДНЕВНИК\nСтарт: "+(DB.start||"—")+"\n\nВЕС\n";
 DB.bw.forEach(x=>t+=x.d+" — "+x.w+" кг\n");
 t+="\nТРЕНИРОВКИ\n";DB.hist.forEach(h=>t+=`${h.d} день ${h.day+1} неделя ${h.wk||"?"} — ${h.dur} мин\n`);
 t+="\nУПРАЖНЕНИЯ\n";
 Object.keys(DB.log).forEach(id=>{t+="\n"+(EX[id]?EX[id].n:id)+"\n";
  DB.log[id].forEach(s=>t+="  "+s.d+": "+s.sets.map(x=>`${x.w||"?"}×${x.r||"?"}`).join(", ")+"\n");});
 box(t);}
function bkp(){box(JSON.stringify(DB));}
function box(t){document.getElementById("box").innerHTML=`<textarea readonly id="bx">${t.replace(/</g,"&lt;")}</textarea>
 <button class="btn sm" style="margin-top:8px" onclick="cp()">Скопировать</button>`;}
function cp(){const t=document.getElementById("bx");t.focus();t.select();
 try{navigator.clipboard?navigator.clipboard.writeText(t.value):document.execCommand("copy");}catch(e){document.execCommand("copy");}}
function rstUI(){document.getElementById("box").innerHTML=`<textarea id="rs" placeholder="Вставь резервную копию"></textarea>
 <button class="btn sm" style="margin-top:8px" onclick="doRst()">Восстановить</button>`;}
function doRst(){try{const d=JSON.parse(document.getElementById("rs").value);
 if(d&&typeof d==="object"){DB=Object.assign(DB,d);guard();save();render();}}catch(e){alert("Не похоже на резервную копию");}}

["setTab","openDay","tg","tick","setV","finEx","quitW","finishW","repPrev","plate","alts","doSwap",
"addBw","startProg","setMenu","tgMeal","loadMeal","clearMeal","fList","addF","editG","delG","setWater","tCheck",
"fillAll","noteUI","saveNote","swapFood","doFoodSwap","expTxt","bkp","rstUI","doRst","cp","tgR","setTheme","addKcal","startTimer"]
.forEach(f=>window[f]=eval(f));
load().then(render);
if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});}
