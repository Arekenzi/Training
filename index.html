<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#090A08">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Программа</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Программа">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#0D1014;--surface:#14181E;--raise:#1A1F27;--line:#232A33;--line2:#2F3742;
--tx:#E9EDF2;--dim:#7C8794;--soft:#B4BDC7;--bone:#F2F5F8;
--chest:#D4453E;--back:#2E74D0;--legs:#1E9C67;--sh:#C98A16;--arms:#8B5CC4;--core:#5B6672;
--ok:#1E9C67;--alert:#D4453E;--hold:#C98A16;--r:10px;--rb:8px;--rc:4px}
body.light{--bg:#F2F4F7;--surface:#FFF;--raise:#F7F9FB;--line:#DFE4EA;--line2:#CDD5DE;
--tx:#111519;--dim:#616C79;--soft:#3A424C;--bone:#111519}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--tx);font-family:"Golos Text",system-ui,-apple-system,sans-serif;
font-size:15px;line-height:1.5;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
body.big{font-size:17px}
#shell{height:100%;display:flex;flex-direction:column}
#scroll{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.wrap{max-width:660px;margin:0 auto;padding:16px 14px 34px}
h1{font-weight:700;font-size:22px;line-height:1.16;letter-spacing:-.025em;margin:0}
h2{font-weight:600;font-size:17px;line-height:1.2;letter-spacing:-.02em;margin:0}
h3{font-weight:600;font-size:15px;line-height:1.25;letter-spacing:-.015em;margin:0}
body.big h1{font-size:25px}body.big h2{font-size:19px}body.big h3{font-size:17px}
.mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
.txt{font-size:14px;color:var(--soft);line-height:1.55}
.eyebrow{font-family:"JetBrains Mono",monospace;font-weight:500;text-transform:uppercase;
letter-spacing:.15em;font-size:9.5px;color:var(--dim);display:block;margin-bottom:6px}
.lbl{font-family:"JetBrains Mono",monospace;font-weight:500;font-size:9px;text-transform:uppercase;
letter-spacing:.14em;color:var(--dim);margin:13px 0 4px;display:block}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.big-num{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:38px;line-height:1;letter-spacing:-.04em}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
padding:14px 15px;margin-bottom:8px;width:100%;text-align:left;color:inherit;font:inherit}
button.tile{cursor:pointer;transition:border-color .14s,background .14s}
button.tile:hover{border-color:var(--line2);background:var(--raise)}
button.tile:focus-visible,.btn:focus-visible,.chk:focus-visible{outline:2px solid var(--bone);outline-offset:2px}
.tile.ok{border-color:var(--ok)}
.day{position:relative;padding-left:19px;overflow:hidden}
.day:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--mark,var(--core))}
.tag{display:inline-flex;align-items:center;font-family:"JetBrains Mono",monospace;font-weight:500;
font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;padding:4px 7px;border-radius:var(--rc);
background:var(--raise);color:var(--dim);border:1px solid var(--line)}
.tag.ok{color:var(--ok);border-color:rgba(30,156,103,.45)}
.row{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.btn{font-family:"Golos Text",sans-serif;font-weight:600;font-size:13.5px;border-radius:var(--rb);
padding:11px 15px;cursor:pointer;border:1px solid var(--line2);background:transparent;color:var(--soft);transition:.14s}
.btn:hover{border-color:var(--dim);color:var(--tx)}
.btn.main{background:var(--bone);border-color:var(--bone);color:#0D1014}
body.light .btn.main{color:#FFF}
.btn.wide{flex:1}.btn.sm{padding:8px 11px;font-size:12.5px}
.btn.on{background:var(--raise);border-color:var(--bone);color:var(--tx)}
.pbar{height:3px;background:var(--line);overflow:hidden;margin:12px 0 14px}
.pbar i{display:block;height:100%;background:var(--bone);transition:width .3s}
.weekdots{display:flex;gap:6px;margin:0 0 14px}
.dot{flex:1;height:5px;background:var(--line)}
.dot.on{background:var(--bone)}
.stack{display:flex;gap:2px;height:9px;overflow:hidden;background:var(--line);margin:12px 0 5px}
.seg{transition:flex-grow .4s ease}
.stack-l{display:flex;justify-content:space-between;font-family:"JetBrains Mono",monospace;
font-size:9.5px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
margin-bottom:8px;overflow:hidden;position:relative;padding-left:4px}
.ex:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--mark,var(--core))}
.ex.ok{border-color:var(--ok)}
.ex-h{padding:13px 14px;display:flex;gap:11px;align-items:flex-start;cursor:pointer}
.ex-n{width:24px;height:24px;flex:0 0 24px;border-radius:var(--rc);display:grid;place-items:center;
background:var(--raise);border:1px solid var(--line);font-family:"JetBrains Mono",monospace;
font-size:10.5px;color:var(--dim)}
.ex-n.ok{background:var(--ok);border-color:var(--ok);color:#0D1014}
.ex-b{padding:12px 14px 14px;border-top:1px solid var(--line)}
.hist{display:flex;align-items:flex-end;gap:2px;height:16px;margin-top:5px}
.hist span{width:4px;background:var(--line2)}
.hist span:last-child{background:var(--bone)}
.setshead{display:flex;gap:6px;align-items:center;margin:2px 0 7px}
.setshead span{font-family:"JetBrains Mono",monospace;font-size:8.5px;text-transform:uppercase;
letter-spacing:.1em;color:var(--dim)}
.set{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.set.warm input,.set.warm .set-n{opacity:.55}
.set-n{width:74px;flex:0 0 74px;font-family:"JetBrains Mono",monospace;font-size:9.5px;
color:var(--dim);line-height:1.2;text-transform:uppercase;letter-spacing:.03em}
.set.drop .set-n{color:var(--hold)}
input,select,textarea{background:var(--raise);border:1px solid var(--line);border-radius:var(--rb);
color:var(--tx);font-size:16px;padding:10px 9px;width:100%;min-width:0;
font-family:"JetBrains Mono",monospace}
input[type=text]{font-family:"Golos Text",sans-serif}
input[type=number],input.c{text-align:center}
input:focus,textarea:focus{outline:0;border-color:var(--bone);background:var(--surface)}
input::placeholder{color:var(--dim);opacity:.6}
.chk{width:44px;height:44px;flex:0 0 44px;border-radius:var(--rb);border:1px solid var(--line2);
background:var(--raise);cursor:pointer;display:grid;place-items:center;color:var(--dim);transition:.14s}
.chk.on{background:var(--ok);border-color:var(--ok);color:#0D1014}
.note,.warn,.good{border-radius:var(--rb);padding:11px 13px;font-size:13px;margin-top:10px;
line-height:1.5;border:1px solid;background:var(--raise)}
.note{border-color:rgba(46,116,208,.35);color:#9EC2F5}
.warn{border-color:rgba(212,69,62,.4);color:#F5A6A2}
.good{border-color:rgba(30,156,103,.4);color:#8FDCB6}
body.light .note{color:#1B4C8C}body.light .warn{color:#95241E}body.light .good{color:#0E5C3B}
.hr{height:1px;background:var(--line);margin:22px 0;border:0}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:20px;display:block;
line-height:1;letter-spacing:-.03em;margin-bottom:5px}
.frow{display:flex;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.pl{font-family:"JetBrains Mono",monospace;font-size:11.5px;padding:5px 8px;border-radius:var(--rc);
background:var(--raise);border:1px solid var(--line2)}
.glass{width:100%;aspect-ratio:1;border-radius:var(--rb);border:1px solid var(--line2);background:var(--raise);
cursor:pointer;display:grid;place-items:center;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--dim)}
.glass.on{background:var(--back);border-color:var(--back);color:#fff}
.spark{width:100%;height:50px;display:block;margin-top:8px}
textarea{min-height:84px;font-size:12px}
.nav{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line);display:flex;
padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;color:var(--dim);font-family:"JetBrains Mono",monospace;
font-size:8.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;padding:10px 2px 9px;
cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;position:relative;transition:color .14s}
.nav button.on{color:var(--tx)}
.nav button.on:after{content:"";position:absolute;top:0;width:28px;height:2px;background:var(--bone)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:square}
.timer{flex:0 0 auto;background:var(--surface);border-top:1px solid var(--line2);padding:10px 14px;display:none}
.timer.on{display:block}
.timer-in{max-width:660px;margin:0 auto;display:flex;align-items:center;gap:12px}
.tlbl{display:block;font-family:"JetBrains Mono",monospace;font-size:9px;text-transform:uppercase;
letter-spacing:.12em;color:var(--dim);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tnum{font-family:"JetBrains Mono",monospace;font-weight:700;font-size:22px;letter-spacing:-.03em;transition:.18s}
.tnum.hot{font-size:28px;color:var(--hold)}
.tnum.over{color:var(--alert)}
.tprog{flex:1;height:3px;background:var(--line);overflow:hidden}
.tfill{height:100%;background:var(--bone);width:100%;transition:width 1s linear}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.diag{background:var(--raise);border:1px solid var(--line);border-radius:var(--rb);
padding:10px 8px 4px;margin:12px 0 4px;color:var(--dim)}
.diag svg{width:100%;max-width:260px;height:auto;display:block;margin:0 auto}
.diag-t{font-family:"JetBrains Mono",monospace;font-size:8.5px;text-transform:uppercase;
letter-spacing:.14em;color:var(--dim);text-align:center;margin-bottom:4px}

:root{--bg:#090A08;--surface:#131512;--raise:#1A1D18;--line:#232720;--line2:#30362C;
--tx:#F3F5EE;--dim:#80887A;--soft:#BAC1B2;--bone:#D4F84A;--lime:#D4F84A;--ok:#B5E02E;--r:22px;--rb:14px;--rc:8px;
--cond:"Oswald","Arial Narrow",sans-serif}
body.light{--bg:#F1F3EC;--surface:#FFF;--raise:#F6F8F1;--line:#DEE3D5;--line2:#CBD2C0;--tx:#10130D;--dim:#646C5C;--soft:#363C30;--bone:#4E6B00;--ok:#4E7A00}
html,body{background:var(--bg);width:100%;max-width:100%}
body{background:radial-gradient(120% 50% at 70% -8%,rgba(212,248,74,.10),transparent 60%) var(--bg) fixed}
body.light{background:var(--bg)}
#scroll{overflow-x:hidden;padding-top:env(safe-area-inset-top)}
.wrap{padding:14px 16px 40px;max-width:560px}
h1,h2{font-family:var(--cond);font-weight:700;letter-spacing:0;text-transform:none}
h1{font-size:30px;line-height:1.05}
h3{font-size:15.5px}
.eyebrow,.lbl{font-family:var(--cond);font-weight:500;font-size:11px;letter-spacing:.14em}
.btn{border-radius:12px;font-weight:600}
.btn.main{color:#090A08;box-shadow:0 12px 28px -14px rgba(212,248,74,.75);font-family:var(--cond);font-size:16px;letter-spacing:.02em}
body.light .btn.main{color:#fff}
.btn.on{border-color:var(--lime);color:var(--tx);background:rgba(212,248,74,.08)}
.chk.on,.ex-n.ok{background:var(--lime);border-color:var(--lime);color:#090A08}
.tile.ok,.ex.ok{border-color:rgba(212,248,74,.5)}
.tile,.ex,.stat{border-radius:18px}
.tag{border-radius:999px;padding:4px 9px}
.tag.ok{color:var(--lime);border-color:rgba(212,248,74,.45)}
.note{border-color:rgba(212,248,74,.18);color:var(--soft)}
body.light .note{color:var(--soft)}
.pbar i,.tfill,.hist span:last-child{background:var(--lime)}
.nav{background:rgba(19,21,18,.94);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
body.light .nav{background:rgba(255,255,255,.94)}
.nav button{font-family:var(--cond);font-size:10.5px;letter-spacing:.1em}
.nav button.on{color:var(--lime)}
body.light .nav button.on{color:var(--bone)}
.nav button.on:after{background:var(--lime);border-radius:2px;width:22px}
.tnum.hot{font-size:34px;color:var(--lime)}
.timer{background:var(--surface)}
.tadj{display:flex;gap:6px}

/* приветствие */
.hello{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:6px 0 20px}
.hello>div:first-child{min-width:0}
.hello .date{font-family:var(--cond);font-weight:500;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.hello h1{font-size:clamp(34px,10.5vw,44px);line-height:1;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ava{position:relative;width:64px;height:64px;flex:0 0 64px;border:0;padding:0;background:none;cursor:pointer}
.ava svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ava .face{position:absolute;inset:6px;border-radius:50%;overflow:hidden;background:var(--raise);display:grid;place-items:center;
font-family:var(--cond);font-weight:700;font-size:24px;color:var(--tx)}
.ava .face img{width:100%;height:100%;object-fit:cover}

/* полоса недели */
.strip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;margin:0 -4px 20px}
.wd{text-align:center;min-width:0}
.wd span{display:block;font-family:var(--cond);font-weight:500;font-size:12.5px;color:var(--dim);margin-bottom:9px;letter-spacing:.06em}
.wd.now span{color:var(--lime)}
.wd b{display:grid;place-items:center;width:min(44px,11.4vw);aspect-ratio:1;margin:0 auto;border-radius:50%;
font-family:var(--cond);font-weight:600;font-size:16px;color:var(--soft);border:1.5px solid transparent}
.wd b.done{background:var(--lime);color:#090A08;box-shadow:0 6px 18px -8px rgba(212,248,74,.8)}
.wd b.today{border:2px solid var(--lime);color:var(--tx)}
.wd b.today.done{border-color:var(--lime)}
.wd b.plan{border:1.5px dashed #3F463A;color:var(--soft)}
.wd b.rest{background:#1A1D18;color:var(--dim)}
.wd b.miss{border:1.5px solid #3A2A26;color:#9B6B62}
body.light .wd b.rest{background:#E6EADF}

/* главная карточка */
.hero{position:relative;overflow:hidden;border-radius:30px;min-height:min(132vw,520px);margin-bottom:22px;
display:flex;flex-direction:column;padding:16px;border:1px solid rgba(255,255,255,.06);background:#0C0D0B;isolation:isolate}
.hero .ph{position:absolute;inset:0;z-index:-1}
.hero .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 40%;
filter:grayscale(1) contrast(1.18) brightness(.62)}
.hero .ph:after{content:"";position:absolute;inset:0;
background:radial-gradient(85% 55% at 72% 38%,rgba(212,248,74,.20),transparent 70%),
linear-gradient(180deg,rgba(9,10,8,.92) 0%,rgba(9,10,8,.25) 26%,rgba(9,10,8,.10) 46%,rgba(9,10,8,.78) 70%,rgba(9,10,8,.97) 88%)}
.hero .ph .tint{position:absolute;inset:0;background:#D4F84A;mix-blend-mode:color;opacity:.16}
.hero .ph.noimg{background:radial-gradient(110% 80% at 80% 22%,rgba(212,248,74,.22),transparent 58%),linear-gradient(165deg,#1C2019,#0C0D0B)}
.hero .ph .art{position:absolute;right:-18px;top:60px;width:84%;color:var(--lime);opacity:.4}
.hero .ph .art svg{width:100%;height:auto}
.hero .ph .art *{stroke:currentColor!important}
.pill{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;padding:8px 14px 8px 12px;border-radius:999px;
background:rgba(20,22,19,.72);border:1px solid rgba(255,255,255,.09);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
font-family:var(--cond);font-weight:600;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx)}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 10px var(--lime)}
.hero h2{margin-top:auto;font-size:clamp(36px,11vw,46px);font-weight:700;line-height:1;color:#fff;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.hero .meta{font-size:15px;color:rgba(243,245,238,.78);margin:10px 0 18px}
.hero .sw{display:flex;gap:6px;margin-top:12px}
.hero .sw button{flex:1;border-radius:999px;border:1px solid rgba(255,255,255,.12);background:rgba(20,22,19,.6);color:var(--soft);
font-family:var(--cond);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;padding:9px 6px;cursor:pointer}
.hero .sw button.on{border-color:var(--lime);color:var(--lime)}
.cta{position:relative;display:flex;align-items:center;justify-content:center;gap:12px;width:100%;border:0;
border-radius:999px;padding:19px 16px;background:var(--lime);color:#090A08;font-family:var(--cond);
font-weight:700;font-size:21px;letter-spacing:.01em;cursor:pointer;box-shadow:0 16px 36px -14px rgba(212,248,74,.75),inset 0 1px 0 rgba(255,255,255,.55);overflow:hidden}
.cta:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 3.6s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.cta:active{transform:scale(.98)}
.cta svg{width:15px;height:17px;fill:#090A08;flex:0 0 auto}

/* программа */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 2px 10px}
.sec h2{font-size:23px}
.sec span{font-family:var(--cond);font-size:13px;color:var(--dim);letter-spacing:.04em;white-space:nowrap}
.progc{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:22px}
.progc .bar{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.progc .bar i{display:block;height:100%;background:var(--lime);border-radius:999px;box-shadow:0 0 14px rgba(212,248,74,.6)}
.progc .nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.progc .nums div{min-width:0}
.progc .nums b{display:block;font-family:var(--cond);font-weight:600;font-size:22px;line-height:1.1}
.progc .nums span{font-size:11.5px;color:var(--dim)}

/* карточки дней */
.dcard{display:flex;align-items:stretch;gap:0;padding:0;overflow:hidden;min-height:104px}
.dcard .tx{flex:1;min-width:0;padding:14px 12px 14px 16px;display:flex;flex-direction:column;justify-content:center}
.dcard h2{font-size:20px;line-height:1.1;margin:7px 0 4px;text-transform:uppercase;letter-spacing:.01em}
.dcard .im{flex:0 0 33%;position:relative;background:#000}
.dcard .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) brightness(.8)}
.dcard .im:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,var(--surface),transparent 55%)}
.dcard.ok .im:after{content:"✓";position:absolute;z-index:2;right:10px;top:10px;width:26px;height:26px;border-radius:50%;
background:var(--lime);color:#090A08;display:grid;place-items:center;font-weight:700;font-size:14px}
.bwc{display:flex;align-items:center;gap:12px}
.bwc b{font-family:var(--cond);font-size:30px;line-height:1}
.bwc input{width:92px;flex:0 0 92px}

/* фото техники */
.shot{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:3/2;margin:14px 0 6px;cursor:zoom-in}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.shot img.b{animation:frB 3.4s infinite}
@keyframes frB{0%,42%{opacity:0}50%,92%{opacity:1}100%{opacity:0}}
.shot-l{position:absolute;left:10px;bottom:10px;display:flex;gap:6px}
.shot-l i{font-style:normal;font-family:var(--cond);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
padding:5px 10px;border-radius:999px;background:rgba(9,10,8,.72);color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.1)}
.shot-l i:first-child{animation:lA 3.4s infinite}.shot-l i:last-child{animation:lB 3.4s infinite}
@keyframes lA{0%,42%{color:#090A08;background:#D4F84A}50%,92%{color:rgba(255,255,255,.55);background:rgba(9,10,8,.72)}100%{color:#090A08;background:#D4F84A}}
@keyframes lB{0%,42%{color:rgba(255,255,255,.55);background:rgba(9,10,8,.72)}50%,92%{color:#090A08;background:#D4F84A}100%{color:rgba(255,255,255,.55);background:rgba(9,10,8,.72)}}
.shot-z{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
background:rgba(9,10,8,.7);color:#fff;font-size:15px;border:1px solid rgba(255,255,255,.12)}
.th{width:54px;height:54px;flex:0 0 54px;border-radius:12px;overflow:hidden;background:#000;position:relative}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .n{position:absolute;left:4px;top:4px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:rgba(9,10,8,.8);
color:#fff;font-family:var(--cond);font-size:11.5px;display:grid;place-items:center}
.th .n.ok{background:var(--lime);color:#090A08}
.ex{padding-left:0}
.ex:before{display:none}
.ex-h{align-items:center;padding:10px 12px}
.ex-h h3{line-height:1.25}
.ex-b{padding:12px 14px 16px}
.zoom{position:fixed;inset:0;z-index:50;background:rgba(5,6,5,.96);display:flex;flex-direction:column;
padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 14px);overflow-y:auto}
.zoom h2{font-size:26px;margin:4px 40px 12px 2px}
.zoom figure{margin:0 0 12px;position:relative;border-radius:16px;overflow:hidden;background:#000}
.zoom figure img{width:100%;display:block}
.zoom figcaption{position:absolute;left:10px;top:10px;font-family:var(--cond);font-size:12px;letter-spacing:.12em;
text-transform:uppercase;padding:5px 11px;border-radius:999px;background:var(--lime);color:#090A08}
.zoom .x{position:fixed;right:14px;top:calc(env(safe-area-inset-top) + 12px);width:40px;height:40px;border-radius:50%;
border:1px solid rgba(255,255,255,.15);background:rgba(20,22,19,.9);color:#fff;font-size:20px;cursor:pointer}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips .btn{flex:0 0 auto;white-space:nowrap}
.wtop{position:sticky;top:0;z-index:5;margin:-14px -16px 12px;padding:14px 16px 10px;background:rgba(9,10,8,.92);
-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
body.light .wtop{background:rgba(241,243,236,.94)}
.wtop .pbar{margin:10px 0 0;height:5px;border-radius:999px}
.wtop .pbar i{border-radius:999px}
.wtop h1{font-size:25px;line-height:1.1;margin-top:4px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal span{font-family:var(--cond);font-size:11px;color:var(--dim);text-align:center;letter-spacing:.06em}
.cal b{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-family:var(--cond);font-weight:500;font-size:14px;
background:var(--raise);color:var(--soft);min-width:0}
.cal b.e{background:none}
.cal b.t{outline:2px solid var(--lime);outline-offset:-2px;color:var(--tx)}
.cal b.d{background:var(--lime);color:#090A08;font-weight:700}
.cal b.p{border:1.5px dashed #3F463A;background:none}
.exh{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:7px 0;border-bottom:1px solid var(--line)}
.exh:last-child{border:0}
/* правки после проверки */
.timer-in{flex-wrap:wrap;gap:8px 10px}
.timer-in>div:first-child{flex:1 1 auto!important;min-width:0!important}
.tprog{flex:1 0 100%;order:-1;height:4px;border-radius:999px}
.tadj .btn{padding:9px 12px}
.ex{scroll-margin-top:118px}
.wtop h1{font-size:22px;line-height:1.1}
.big-num,.stat b{font-family:var(--cond);font-weight:600;letter-spacing:0}
.big-num{font-size:46px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:22px}
.seg button{flex:1;border:0;background:none;color:var(--dim);font-family:var(--cond);font-weight:600;font-size:14px;
letter-spacing:.06em;text-transform:uppercase;padding:11px 6px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--lime);color:#090A08}
.timer-in>div:first-child{flex:1 1 0!important}
.sec h2{font-size:clamp(19px,6vw,23px)}
@media(max-width:359px){.set-n{width:54px;flex:0 0 54px;font-size:8.5px}.setshead span:first-child{width:54px!important;flex:0 0 54px!important}
 .set input{padding:10px 3px}.chk{width:40px;height:40px;flex:0 0 40px}.dcard .tx{padding-left:13px}.dcard h2{font-size:18px}.tadj .btn{padding:8px 9px}}
/* ===== режим фокуса ===== */
body.fxon .nav,body.fxon .timer{display:none!important}
.fx,.donev{position:fixed;inset:0;z-index:40;display:none;background:#090A08;overflow:hidden}
.fx.on,.donev.on{display:block}
.fx-in{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;
padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 12px);
background:radial-gradient(90% 45% at 50% 62%,rgba(212,248,74,.09),transparent 70%)}
.fx-top{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.fx-ic{width:42px;height:42px;flex:0 0 42px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:#1A1D18;color:#F3F5EE;
display:grid;place-items:center;font-size:17px;cursor:pointer}
.fx-ic svg{width:20px;height:20px}
.fx-ic.on{color:var(--lime)}
.fx-tt{flex:1;min-width:0;text-align:center;line-height:1.2}
.fx-tt b{display:block;font-family:var(--cond);font-weight:600;font-size:17px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-tt>span{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--dim)}
.fx-seg{display:flex;gap:4px;margin:12px 0 10px;flex:0 0 auto}
.fx-seg i{flex:1;height:4px;border-radius:2px;background:#2A2F27;overflow:hidden;cursor:pointer;position:relative}
.fx-seg i b{display:block;height:100%;background:var(--lime)}
.fx-seg i.c{background:#3D4436}
.fx-ph{position:relative;flex:1 1 auto;min-height:120px;max-height:250px;border-radius:22px;overflow:hidden;background:#000;margin:0 -2px}
.fx-ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%}
.fx-ph:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,10,8,0) 35%,rgba(9,10,8,.75) 72%,#090A08 100%)}
.fx-art{position:absolute;inset:0;display:grid;place-items:center;color:var(--lime);opacity:.5}
.fx-art svg{width:80%}.fx-art *{stroke:currentColor!important}
.fx-cap{position:absolute;left:0;right:0;bottom:8px;z-index:1;text-align:center;padding:0 12px}
.fx-cap span{font-family:var(--cond);font-weight:600;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--lime)}
.fx-cap h2{font-size:clamp(26px,8.2vw,36px);line-height:1;color:#fff;margin:4px 0 2px;text-shadow:0 2px 14px rgba(0,0,0,.6)}
.fx-cap p{margin:0;font-size:13.5px;color:#A9B7FF}
.fx-mid{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding-top:8px}
.ring{position:relative;width:min(62vw,232px,30vh);aspect-ratio:1;margin:2px auto 10px}
.rsvg{width:100%;height:100%;transform:rotate(0deg);overflow:visible}
.rbg{fill:none;stroke:#1F231C;stroke-width:7}
.rfg{fill:none;stroke:var(--lime);stroke-width:7;stroke-linecap:round;stroke-dasharray:1000;stroke-dashoffset:0;
transform:rotate(-90deg);transform-origin:100px 100px;transition:stroke-dashoffset .5s linear;filter:drop-shadow(0 0 8px rgba(212,248,74,.75))}
.ring.work .rfg{stroke-dashoffset:0;opacity:.9}
.tk{stroke:#3A4135;stroke-width:1.2}.tk5{stroke:#7D8775;stroke-width:2}
.ring.rest .tk5{stroke:#C9D3BE}
.ring:before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(closest-side,rgba(212,248,74,.16),transparent);z-index:-1}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 18%}
.rc b{font-family:var(--cond);font-weight:700;font-size:clamp(46px,15vw,64px);line-height:1;color:#fff;letter-spacing:.01em}
.rc b.hot{color:var(--lime)}.rc b.over{color:#FF8A7A}
.rc span{font-family:var(--cond);font-weight:500;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#C8CFC0;margin-top:6px}
.rc em{font-style:normal;font-family:var(--cond);font-weight:600;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--lime);margin-bottom:4px}
.ring.paused .rfg{opacity:.45;filter:none}
.fx-ctl{display:flex;align-items:center;justify-content:center;gap:12px;margin:2px 0 12px}
.fx-b{width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.08);background:#1C2240;color:#E6EAFF;display:grid;place-items:center;
font-family:var(--cond);font-weight:600;font-size:15px;cursor:pointer}
.fx-b svg{width:20px;height:20px;fill:currentColor}
.fx-b.big{width:76px;height:76px;background:var(--lime);color:#090A08;border:0;box-shadow:0 0 0 8px rgba(212,248,74,.12),0 12px 30px -8px rgba(212,248,74,.8)}
.fx-b.big svg{width:30px;height:30px}
.fx-inp{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-bottom:10px}
.stp{display:flex;align-items:center;background:#151813;border:1px solid #262A23;border-radius:18px;padding:5px;min-width:0}
.stp button{width:40px;height:44px;flex:0 0 40px;border:0;border-radius:13px;background:#22261F;color:#fff;font-size:22px;cursor:pointer}
.stp label{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.stp input{background:none;border:0;padding:2px 0 0;text-align:center;font-family:var(--cond);font-weight:700;font-size:26px;color:#fff;width:100%}
.stp input:focus{background:none}
.stp span{font-size:10.5px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;font-family:var(--cond)}
.fx-go{margin-bottom:10px;padding:17px}
.fx-sug{width:100%;font-size:12.5px;padding:8px 12px;border-radius:12px;margin-bottom:8px;text-align:center}
.fx-sug.up{background:rgba(212,248,74,.1);color:var(--lime)}.fx-sug.down{background:rgba(255,138,122,.1);color:#FF8A7A}
.fx-next{flex:0 0 auto;display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px 10px 10px;border-radius:20px;
background:#151A2E;border:1px solid rgba(143,160,255,.16);color:#fff;cursor:pointer;margin-top:auto}
.fx-next>div:nth-child(2){flex:1;min-width:0}
.fx-next span{display:block;font-family:var(--cond);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:#8FA0FF}
.fx-next b{display:block;font-family:var(--cond);font-weight:600;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fx-next em{font-style:normal;font-family:var(--cond);font-weight:700;color:#8FA0FF;font-size:18px}
.fx-next .th{width:48px;height:48px;flex:0 0 48px}
.th.fin{display:grid;place-items:center;background:var(--lime);color:#090A08;font-weight:700;font-size:20px}
@media(max-height:700px){.fx-ph{max-height:150px}.ring{width:min(52vw,180px,28vh)}.fx-b{width:46px;height:46px}.fx-b.big{width:64px;height:64px}}
.fxbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:10px;padding:13px;font-size:17px}

/* ===== тренировка завершена ===== */
.donev{overflow-y:auto;background:radial-gradient(120% 60% at 50% 12%,#5C7A12 0%,#2B3A0C 30%,#0F130A 58%,#090A08 80%)}
.dn-in{position:relative;z-index:2;max-width:480px;margin:0 auto;text-align:center;
padding:calc(env(safe-area-inset-top) + 26px) 18px calc(env(safe-area-inset-bottom) + 22px);min-height:100%;display:flex;flex-direction:column}
.dn-check{position:relative;width:200px;height:200px;margin:0 auto 6px;display:grid;place-items:center}
.dn-check i{position:absolute;border-radius:50%;border:1.5px solid rgba(212,248,74,.35);animation:pulse 2.6s ease-out infinite}
.dn-check i:nth-child(1){inset:0;animation-delay:0s}.dn-check i:nth-child(2){inset:22px;animation-delay:.3s}.dn-check i:nth-child(3){inset:44px;animation-delay:.6s}
.dn-check b{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#F2FFB8,#D4F84A 60%,#B9E12A);display:grid;place-items:center;
box-shadow:0 0 40px rgba(212,248,74,.75),0 0 0 10px rgba(212,248,74,.12);animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
.dn-check b svg{width:46px;height:46px}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%{transform:scale(.85);opacity:0}30%{opacity:1}100%{transform:scale(1.08);opacity:.25}}
.dn-k{display:block;font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#E3F3A6;margin-bottom:6px}
.donev h1{font-size:clamp(34px,10vw,44px);line-height:1.02;color:#fff}
.dn-s{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:21px;color:#D9E0FF;margin:8px 0 22px}
.dn-st{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:16px}
.dn-st div+div{border-left:1px solid rgba(255,255,255,.12)}
.dn-st b{display:block;font-family:var(--cond);font-weight:700;font-size:34px;line-height:1.05;color:#fff}
.dn-st span{font-family:var(--cond);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#C8D3BB}
.dn-card{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border-radius:22px;background:rgba(28,34,64,.82);
border:1px solid rgba(143,160,255,.18);margin-bottom:10px}
.dn-card .fl{width:46px;height:46px;flex:0 0 46px;border-radius:50%;background:var(--lime);display:grid;place-items:center;box-shadow:0 0 18px rgba(212,248,74,.5)}
.dn-card .fl svg{width:22px;height:22px}
.dn-card .big{font-family:var(--cond);font-size:32px;color:#fff;line-height:1}
.dn-card .dots{display:flex;gap:5px;align-self:flex-start;margin-top:4px}
.dn-card .dots i{width:7px;height:7px;border-radius:50%;background:#4A5385}
.dn-card .dots i.on{background:var(--lime);box-shadow:0 0 6px var(--lime)}
.dn-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}
.dn-row div{background:rgba(20,23,18,.75);border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:11px 6px}
.dn-row b{display:block;font-family:var(--cond);font-size:20px;color:#fff}
.dn-row span{font-size:11px;color:#AEB7A4}
.dn-pr{text-align:left;background:rgba(212,248,74,.08);border:1px solid rgba(212,248,74,.25);border-radius:16px;padding:12px 14px;font-size:14px;color:#fff;margin-bottom:10px}
.dn-btns{margin-top:auto;padding-top:18px}
.dn-home{display:block;margin:12px auto 0;background:none;border:0;color:#fff;font-family:var(--cond);font-size:17px;padding:8px 20px;cursor:pointer}
.conf{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.conf i{position:absolute;top:-24px;border-radius:2px;opacity:.95;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-30px) rotate(var(--r))}100%{transform:translateY(110vh) rotate(calc(var(--r) + 540deg))}}
@media(prefers-reduced-motion:reduce){.conf{display:none}}

.ring.work .rfg{stroke-dashoffset:var(--done)}
.ring.work .rbg{stroke:#262B22}
.rc span{white-space:nowrap}
.rc .rir{margin-top:2px;color:var(--lime);opacity:.85}

.ring.work .rfg{opacity:var(--vis,1)}
.fx-mid{flex:1 1 auto;justify-content:center}
.fx-ph img{object-position:50% 22%}

.rc span{white-space:normal;line-height:1.25}
.fx-in{overflow-y:auto;-webkit-overflow-scrolling:touch}
.fx-ph{flex-shrink:0;height:clamp(110px,28vh,250px)}
@media(max-height:620px){.fx-ph{height:104px}.fx-cap h2{font-size:24px}.fx-cap p{display:none}.fx-seg{margin:8px 0 8px}
 .ring{width:min(46vw,150px)}.rc b{font-size:40px}.fx-go{padding:13px}.stp button{height:38px}.fx-next{padding:7px 10px 7px 7px}.fx-next .th{width:40px;height:40px;flex-basis:40px}}
@media(max-width:359px){.dn-card .dots{display:none}.dn-st b{font-size:28px}}
.rc em{white-space:nowrap}@media(max-height:620px){.rc em{font-size:11px;letter-spacing:.06em}}

const DBAPI=(function(){
 let ok=true;try{localStorage.setItem("__p","1");localStorage.removeItem("__p");}catch(e){ok=false;}
 const mem={};
 return{ok:ok,
  async get(k){let v;try{v=ok?localStorage.getItem(k):(k in mem?mem[k]:null);}catch(e){v=null;}
   return (v===null||v===undefined)?null:{key:k,value:v};},
  async set(k,v){try{if(ok)localStorage.setItem(k,v);else mem[k]=v;}catch(e){return null;}return{key:k,value:v};},
  async delete(k){try{if(ok)localStorage.removeItem(k);else delete mem[k];}catch(e){}return{key:k,deleted:true};}};
})();
const KEY="trener:v4";
let DB={start:null,wk:0,kcalAdj:0,swap:{},log:{},done:{},hist:[],bw:[],fail:{},notes:{},
 food:{},water:{},check:{},menu:0,theme:"dark",big:false,pause:false};

 if(!(DB.menu>=0&&DB.menu<MENUS.length))DB.menu=0;
 ["done","log","fail","notes","food","water","check","swap"].forEach(k=>{
  if(!DB[k]||typeof DB[k]!=="object"||Array.isArray(DB[k]))DB[k]={};});
 ["hist","bw"].forEach(k=>{if(!Array.isArray(DB[k]))DB[k]=[];});}
async function load(){
 if(SMODE==="none"){guard();return;}
 try{const r=await DBAPI.get(KEY);if(r&&r.value)DB=Object.assign(DB,JSON.parse(r.value));}catch(e){}
 if(!DB.start){try{const o=await DBAPI.get("trener:v3");
  if(o&&o.value){const q=JSON.parse(o.value);
   DB.log=q.log||{};DB.hist=q.hist||[];DB.bw=q.bw||[];DB.start=q.start||null;DB.kcalAdj=q.kcalAdj||0;}}catch(e){}}
 guard();
 if(DB.cur&&DB.cur.t0&&Date.now()-DB.cur.t0<6*3600e3&&DB.cur.sets){session=DB.cur;tab="gym";}else DB.cur=null;}
async function save(){if(SMODE==="none")return;
 for(let i=0;i<2;i++){try{const r=await DBAPI.set(KEY,JSON.stringify(DB));
  if(r!==null){if(SMODE==="err"){SMODE="ok";render();}return;}}catch(e){}

const today=()=>{const x=new Date();return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");};
function weekNow(){if(!DB.start)return 1;
 return Math.max(1,Math.floor((Date.now()-new Date(DB.start+"T00:00:00").getTime())/864e5/7)+1);}
function wIdx(){return DB.wk===undefined?((weekNow()-1)%2):DB.wk;}
function setWk(i){DB.wk=i;save();render();}
function W(){return WEEKS[wIdx()];}
function bw(){return DB.bw.length?DB.bw[DB.bw.length-1].w:102;}
function trend(){const b=DB.bw;if(b.length<3)return null;
 const f=b[0],l=b[b.length-1],days=(new Date(l.d)-new Date(f.d))/864e5;
 if(days<14)return null;return{rate:(l.w-f.w)/days*7,days:Math.round(days)};}
function addKcal(v){DB.kcalAdj=(DB.kcalAdj||0)+v;save();render();}
function target(){const w=bw(),bmr=10*w+6.25*190-5*35+5,tdee=bmr*1.42;
 const k=Math.round(tdee*0.8/10)*10+(DB.kcalAdj||0),p=Math.round(w*1.9/5)*5,f=Math.round(w*0.8/5)*5;
 return{k,p,f,c:Math.round((k-p*4-f*9)/4),tdee:Math.round(tdee)};}
function swapOf(id){return DB.swap[id]||id;}
function itemsFor(di){return W().days[di].items.map(x=>Object.assign({},x,{id:swapOf(x.id),orig:x.id}));}
function lastLog(id){const l=DB.log[id];return l&&l.length?l[l.length-1]:null;}
function bestOf(id){const l=DB.log[id];if(!l)return 0;let m=0;
 l.forEach(s=>s.sets.forEach(x=>{if(+x.w>m)m=+x.w;}));return m;}

/* ================= ЗАЛ ================= */
const BLOCK=24,PNAME="Масса 24";
const DN=["вс","пн","вт","ср","чт","пт","сб"],FULLD=["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
const MON=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
const DMAP={2:0,4:1,6:2};
function dkey(x){return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");}
function nextDay(){const now=new Date(),dow=now.getDay(),w=weekNow();
 for(let k=0;k<8;k++){const dd=(dow+k)%7;if(dd in DMAP&&!(k===0&&DB.done[w+"-"+DMAP[dd]]))return{off:k,di:DMAP[dd]};}
 return{off:0,di:0};}
function dayMeta(di){const it=itemsFor(di),sets=it.reduce((a,x)=>a+x.s,0);
 return{it,sets,mins:Math.round(sets*1.3+it.length*1.8+15)};}
function ava(pct){const r=29,c=2*Math.PI*r;
 return `<button class="ava" onclick="pickAva()" aria-label="Фото профиля">
 <svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--line)" stroke-width="3"/>
 <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--lime)" stroke-width="3" stroke-linecap="round"
 stroke-dasharray="${(c*Math.max(pct,4)/100).toFixed(1)} ${c.toFixed(1)}"/></svg>
 <span class="face">${DB.ava?`<img src="${DB.ava}" alt="">`:"А"}</span></button>`;}
function pickAva(){const i=document.createElement("input");i.type="file";i.accept="image/*";
 i.onchange=()=>{const f=i.files&&i.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const s=160,cv=document.createElement("canvas");cv.width=cv.height=s;
   const k=Math.min(im.width,im.height),ctx=cv.getContext("2d");
   ctx.drawImage(im,(im.width-k)/2,(im.height-k)/2,k,k,0,0,s,s);DB.ava=cv.toDataURL("image/jpeg",.82);save();render();};
   im.src=r.result;};r.readAsDataURL(f);};i.click();}
function hero(){const wk=W(),w=weekNow(),now=new Date(),dow=now.getDay(),{off,di}=nextDay();
 const {it,sets,mins}=dayMeta(di),d=wk.days[di];
 const mon=new Date(now);mon.setDate(now.getDate()-((dow+6)%7));
 const hd=new Set(DB.hist.map(h=>h.d));let strip="";
 for(let k=0;k<7;k++){const x=new Date(mon);x.setDate(mon.getDate()+k);
  const key=dkey(x),xd=x.getDay(),isT=key===dkey(now),past=x<now&&!isT;
  let cls=hd.has(key)?"done":(xd in DMAP)?(past?"miss":"plan"):"rest";if(isT)cls+=" today";
  strip+=`<div class="wd ${isT?"now":""}"><span>${DN[xd].toUpperCase()}</span><b class="${cls}">${x.getDate()}</b></div>`;}
 const doneW=[0,1,2].filter(i=>DB.done[w+"-"+i]).length;
 const n=DB.hist.length,inBlock=n%BLOCK,num=inBlock+1,blk=Math.floor(n/BLOCK)+1,pct=Math.round(inBlock/BLOCK*100);
 const t=d.t.split(" · ")[0],title=t[0]+t.slice(1).toLowerCase(),e0=EX[it[0].id];
 const when=off===0?"сегодня":off===1?"завтра":FULLD[(dow+off)%7];
 const ph=e0&&e0.img?`<div class="ph"><img src="${imgU(e0,1)}" alt="" onerror="this.parentNode.classList.add('noimg');this.remove()"><span class="tint"></span></div>`
  :`<div class="ph noimg">${patOf(e0)?`<div class="art">${patOf(e0)[1]}</div>`:""}</div>`;
 return `<div class="hello"><div><div class="date">${FULLD[dow]} · ${now.getDate()} ${MON[now.getMonth()]}</div>
 <h1>Привет, Артур</h1></div>${ava(Math.round(doneW/3*100))}</div>
 <div class="strip">${strip}</div>
 <div class="hero">${ph}
 <span class="pill">${when} · день ${num} из ${BLOCK}</span>
 <h2>${title}: день ${String(num).padStart(2,"0")}</h2>
 <div class="meta">${mins} мин · ${it.length} упражнений · ${wk.short.toLowerCase()}</div>
 <button class="cta" onclick="openDay(${di},1)"><svg viewBox="0 0 10 12"><path d="M0 0L10 6L0 12z"/></svg>Начать тренировку</button>
 </div>
 <div class="sec"><h2>Программа «${PNAME}»</h2><span>${pct}% пройдено</span></div>
 <div class="progc"><div class="bar"><i style="width:${Math.max(pct,2)}%"></i></div>
 <div class="nums"><div><b>${doneW}/3</b><span>за неделю</span></div><div><b>${n}</b><span>всего</span></div>
 <div><b>${blk}</b><span>блок</span></div></div></div>
 <div class="seg">${WEEKS.map((x,k)=>`<button class="${wIdx()===k?"on":""}" onclick="setWk(${k})">${x.short} неделя</button>`).join("")}</div>`;}
function vGym(){const w=weekNow(),wk=W();
 const b=DB.bw,last=b.length?b[b.length-1]:null,first=b.length?b[0]:null;
 app.innerHTML=banner()+`${hero()}
 ${!DB.start?`<button class="btn main" style="width:100%;margin-bottom:22px" onclick="startProg()">Начать программу с сегодня</button>`:""}
 <div class="sec"><h2>${wk.name}</h2><span>неделя ${w}</span></div>
 ${wk.days.map((d,i)=>{const done=DB.done[`${w}-${i}`],m=dayMeta(i);
  return `<button class="tile dcard ${done?"ok":""}" onclick="openDay(${i})"><div class="tx">

  <h2>${d.t}</h2><div class="dim" style="font-size:12.5px">${m.it.length} упр · ${m.sets} подходов · ~${m.mins} мин</div></div>
  <div class="im">${EX[m.it[0].id]&&EX[m.it[0].id].img?`<img src="${imgU(EX[m.it[0].id],1)}" loading="lazy" alt="" onerror="this.remove()">`:""}</div></button>`;}).join("")}

 <div class="tile bwc"><b>${last?last.w:"—"}</b><span class="dim" style="font-size:12.5px;flex:1">кг${first&&last&&b.length>1?`<br>${(last.w-first.w>0?"+":"")+(last.w-first.w).toFixed(1)} с начала`:""}</span>
 <input type="number" inputmode="decimal" id="bwIn" placeholder="кг"><button class="btn sm main" onclick="addBw()">OK</button></div>
 <div class="hr"></div><h3>Как пользоваться</h3>
 ${HOWTO.map(([n,t])=>`<div class="tile" style="margin-bottom:7px"><b style="font-size:14.5px">${n}</b>
 <div class="txt" style="margin-top:5px">${t}</div></div>`).join("")}
 <div class="hr"></div><h3>Разминка — 5–7 минут</h3>
 <p class="txt">3–4 минуты кардио до лёгкого пота. Круги руками по 15, вращения тазом и коленями по 10.
 Наружная ротация плеча с резиной 2×15 — не пропускай, это профилактика боли в плече.</p>`;}
function startProg(){DB.start=today();save();render();}
function openDay(i,f){if(session&&session.di===i){if(f)fxOpen();else{session.focus=false;render();}return;}
 session={di:i,t0:Date.now(),sets:{},focus:!!f,fx:0};if(f)unlockAudio();DB.cur=session;open.clear();open.add(0);save();wake(true);render();
 const sc=document.getElementById("scroll");if(sc)sc.scrollTop=0;}

/* экран не гаснет во время тренировки */
let wl=null;
async function wake(on){try{if(on&&"wakeLock" in navigator&&!wl){wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null;});}
 else if(!on&&wl){await wl.release();wl=null;}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&session)wake(true);});

function suggestion(it){const l=lastLog(it.id);if(!l)return null;
 const wk=l.sets.filter(s=>!s.warm&&!s.drop);if(!wk.length)return null;
 if(it.hi>0&&wk.every(s=>+s.r>=it.hi))return{k:"up",t:"Все подходы на верхней границе — в этот раз добавь вес."};
 if((DB.fail[it.id]||0)>=2)return{k:"down",t:"Дважды не добрал нижнюю границу. Сними 10 % и иди вверх заново."};
 return null;}
function histBar(id){const l=DB.log[id];if(!l||l.length<2)return "";
 const v=l.slice(-6).map(s=>Math.max(0,...s.sets.filter(x=>!x.warm).map(x=>+x.w||0)));
 const mx=Math.max(...v)||1;
 return `<div class="hist">${v.map(x=>`<span style="height:${Math.max(3,Math.round(x/mx*16))}px"></span>`).join("")}</div>`;}

 const doneN=it.filter(x=>session.sets[x.id]&&session.sets[x.id].fin).length;
 app.innerHTML=banner()+`<div class="wtop"><div class="row" style="justify-content:space-between;flex-wrap:nowrap;gap:10px">
 <div style="min-width:0"><span class="eyebrow" style="margin:0">${DAYN[di]} · ${wk.short.toLowerCase()} · ${doneN} из ${it.length}</span>

function exBlock(it,n,items){const e=EX[it.id];if(!e)return "";
 const st=session.sets[it.id]||{},prev=lastLog(it.id),sg=suggestion(it),o=open.has(n);
 const pair=it.ss?EX[(items[n+1]||{}).id]:null;
 let rows="";
 for(let i=0;i<it.s;i++)rows+=setRow(it,"s"+i,"подход "+(i+1),false,false,prev,i);
 if(it.drop)rows+=setRow(it,"d0","дроп-сет",false,true,prev,0);
 const doneS=Object.keys(st).filter(k=>st[k]&&st[k].ok).length;
 return `<div class="ex ${st.fin?"ok":""}" id="exw${n}">
 <div class="ex-h" onclick="tg(${n})">${thumb(it.id,n+1,st.fin)}
 <div style="flex:1;min-width:0"><h3>${e.n}</h3>
 <div class="dim mono" style="font-size:11px;margin-top:3px">${it.s}×${it.r} · отдых ${it.rest||"0"} с${it.rir?" · запас "+it.rir:""}${it.drop?" · дроп":""}${pair?" · суперсет":""}${doneS&&!st.fin?` · <span style="color:var(--lime)">${doneS}/${it.s+(it.drop?1:0)}</span>`:""}</div>
 ${prev?`<div class="dim mono" style="font-size:10.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">прошлый: ${prev.sets.filter(s=>!s.warm).map(s=>`${s.w||"?"}×${s.r||"?"}`).join(" · ")}</div>`:""}
 ${histBar(it.id)}</div><span class="dim" style="flex:0 0 auto">${o?"▴":"▾"}</span></div>
 ${o?`<div class="ex-b">
 ${sg?`<div class="${sg.k==="up"?"good":"warn"}" style="margin-top:0;margin-bottom:10px">${sg.t}</div>`:""}
 ${pair?`<div class="note" style="margin-top:0;margin-bottom:10px"><b>Суперсет с «${pair.n}»</b> — оно идёт следующим. Подход здесь, сразу подход там, отдых только после круга.</div>`:""}
 <div class="setshead"><span style="width:74px;flex:0 0 74px">подход</span>
 <span style="flex:1;text-align:center">вес, кг</span><span style="flex:1;text-align:center">повторы</span>
 <span style="width:44px;flex:0 0 44px;text-align:center">готово</span></div>
 <div style="margin-bottom:8px">${rows}</div>
 <div class="row">${prev?`<button class="btn sm" onclick="repPrev('${it.id}')">Повторить прошлый</button>`:""}
 <button class="btn sm" onclick="fillAll('${it.id}',${it.s})">Все как первый</button>
 <button class="btn sm" onclick="plate('${it.id}',${n})">Блины</button>
 <button class="btn sm" onclick="alts('${it.id}',${n})">Заменить</button>
 <button class="btn sm" onclick="noteUI('${it.id}',${n})">Заметка</button></div>
 ${DB.notes[it.id]?`<div class="note"><b>Заметка:</b> ${DB.notes[it.id]}</div>`:""}
 <div id="ex${n}"></div>
 ${e.f?`<div class="good">Последний подход можно до отказа.${it.drop?" Затем дроп-сет: минус половина веса, без паузы, до жжения.":""}</div>`
      :`<div class="warn">До отказа НЕ работаешь: свободный вес. Останавливаешься за повтор до.</div>`}
 ${photo(it.id)}
 <div class="lbl">Техника</div><div class="txt">${e.t}</div>
 <div class="lbl">Ошибки</div><div class="txt">${e.err||"—"}</div>
 <div class="lbl">Как понять, что работает нужная мышца</div><div class="txt">${e.feel||"—"}</div>
 <div class="lbl">Зачем</div><div class="txt">${e.why}</div>
 <div class="lbl">Оборудование · цель · старт</div><div class="txt">${e.eq} · ${e.m} · ${e.st}</div>
 <button class="btn sm" style="margin-top:14px;width:100%" onclick="fxOpen(${n})">Открыть в режиме тренировки</button>
 <button class="btn main" style="margin-top:8px;width:100%" onclick="finEx('${it.id}',${n})">Упражнение сделано</button></div>`:""}</div>`;}

function setRow(it,k,lbl,warm,drop,prev,i){
 const st=(session.sets[it.id]||{})[k]||{},pw=prev&&prev.sets.filter(s=>!s.warm)[i];
 let hint=warm?"лёгкий":(pw&&pw.w)||"кг";
 if(warm){const cur=(session.sets[it.id]||{})["s0"],base=(cur&&+cur.w)||(pw&&+pw.w)||0;
  if(base)hint=Math.round(base*(i===0?0.4:0.65)/2.5)*2.5+" кг";}
 return `<div class="set ${warm?"warm":""} ${drop?"drop":""}"><span class="set-n">${lbl}</span>
 <input type="number" inputmode="decimal" placeholder="${hint}" value="${st.w||""}" onchange="setV('${it.id}','${k}','w',this.value)">
 <input type="number" inputmode="numeric" placeholder="повт" value="${st.r||""}" onchange="setV('${it.id}','${k}','r',this.value)">
 <button class="chk ${st.ok?"on":""}" onclick="tick('${it.id}','${k}',${it.rest},'${k}')" aria-label="Подход выполнен">${CHECK}</button></div>`;}
let svT=null;function saveSoon(){clearTimeout(svT);svT=setTimeout(save,500);}
function setV(id,k,f,v){session.sets[id]=session.sets[id]||{};session.sets[id][k]=session.sets[id][k]||{};session.sets[id][k][f]=v;saveSoon();}
function tick(id,k,rest,label){session.sets[id]=session.sets[id]||{};session.sets[id][k]=session.sets[id][k]||{};
 const c=session.sets[id][k];c.ok=!c.ok;
 if(c.ok){const nm=EX[id]?EX[id].n:"";
  const num=k[0]==="s"?("подход "+(+k.slice(1)+1)):k[0]==="w"?"разминка":"дроп-сет";
  startTimer(rest,nm,num);if(navigator.vibrate)navigator.vibrate(30);}
 save();render();}
function tg(n){open.has(n)?open.delete(n):open.add(n);render();}
function repPrev(id){const p=lastLog(id);if(!p)return;session.sets[id]=session.sets[id]||{};
 p.sets.filter(s=>!s.warm&&!s.drop).forEach((s,i)=>{session.sets[id]["s"+i]={w:s.w,r:s.r};});render();}
function plate(id,n){const st=session.sets[id]||{};let t=0;
 for(const k in st)if(k[0]==="s"&&st[k].w){t=+st[k].w;break;}
 const el=document.getElementById("ex"+n);if(!el)return;
 if(!t){el.innerHTML='<div class="note">Впиши вес в рабочий подход — посчитаю блины.</div>';return;}
 let per=(t-20)/2,out=[],rest=per;
 [25,20,15,10,5,2.5,1.25].forEach(p=>{while(rest>=p-0.01){out.push(p);rest=+(rest-p).toFixed(2);}});
 el.innerHTML=per<=0?`<div class="note">${t} кг меньше грифа. Бери гантели или лёгкий гриф.</div>`:
 `<div class="note">На ${t} кг: гриф 20 кг плюс с каждой стороны
 <div class="row" style="margin-top:8px">${out.map(p=>`<span class="pl">${p}</span>`).join("")}</div>
 ${rest>0.01?`<div style="margin-top:6px">Не хватает ${rest} кг — округли до ${t-rest*2} кг.</div>`:""}</div>`;}
function alts(id,n){const e=EX[id],el=document.getElementById("ex"+n);if(!el||!e)return;
 const g=grp(e),items=itemsFor(session.di),orig=items[n]?items[n].orig:id;
 const best=(EX[orig]&&EX[orig].alt||[]).concat(e.alt||[]).filter((a,i,arr)=>EX[a]&&a!==id&&arr.indexOf(a)===i);
 const pool=best.concat(Object.keys(EX).filter(a=>a!==id&&grp(EX[a])===g&&!best.includes(a)));
 el.innerHTML=`<div class="note"><b>Заменить — ${g.toLowerCase()}</b>
 <div class="dim" style="font-size:11.5px;margin:5px 0 9px">Подходы и повторы те же. Замена сохранится на следующие тренировки. Первые — самые близкие по движению.</div>
 <div style="max-height:340px;overflow:auto;-webkit-overflow-scrolling:touch">${pool.map((a,i)=>
 `<div class="frow">${thumb(a)}<span style="flex:1;min-width:0;font-size:13px">${i<best.length?'<span style="color:var(--lime);font-size:10px;letter-spacing:.1em">ЛУЧШАЯ ЗАМЕНА</span><br>':""}${EX[a].n}<br><span class="dim" style="font-size:10.5px">${EX[a].eq}</span></span>
 <button class="btn sm" onclick="doSwap('${orig}','${a}')">Взять</button></div>`).join("")}</div>
 ${DB.swap[orig]?`<button class="btn sm" style="margin-top:10px" onclick="doSwap('${orig}','')">Вернуть исходное</button>`:""}</div>`;}
function fillAll(id,cnt){const st=session.sets[id]||{},f=st["s0"];
 if(!f||!f.w){alert("Сначала заполни первый подход");return;}
 for(let i=1;i<cnt;i++)st["s"+i]=Object.assign({},st["s"+i]||{},{w:f.w,r:f.r});
 session.sets[id]=st;render();}
function noteUI(id,n){const el=document.getElementById("ex"+n);if(!el)return;
 el.innerHTML=`<div class="note"><input type="text" id="nt" placeholder="Например: третья дырка на скамье" value="${DB.notes[id]||""}">
 <button class="btn sm" style="margin-top:8px" onclick="saveNote('${id}')">Сохранить</button></div>`;}
function saveNote(id){const v=document.getElementById("nt").value.trim();
 if(v)DB.notes[id]=v;else delete DB.notes[id];save();render();}
function doSwap(orig,to){if(to)DB.swap[orig]=to;else delete DB.swap[orig];save();render();}
function finEx(id,n){const st=session.sets[id]||{};st.fin=true;session.sets[id]=st;
 const it=itemsFor(session.di).find(x=>x.id===id);
 if(it&&!st.logged){const arr=[];
  for(let i=0;i<(it.w||0);i++){const c=st["w"+i];if(c&&(c.w||c.r))arr.push({w:c.w,r:c.r,warm:1});}
  for(let i=0;i<it.s;i++){const c=st["s"+i];if(c&&(c.w||c.r))arr.push({w:c.w,r:c.r});}
  if(st.d0&&(st.d0.w||st.d0.r))arr.push({w:st.d0.w,r:st.d0.r,drop:1});
  if(arr.length){st.logged=1;DB.log[id]=DB.log[id]||[];DB.log[id].push({d:today(),sets:arr});

/* ================= КАЛЕНДАРЬ ================= */
let calM=null;
function calendar(){const now=new Date();if(!calM)calM=new Date(now.getFullYear(),now.getMonth(),1);
 const y=calM.getFullYear(),m=calM.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate();
 const hd={};DB.hist.forEach(h=>{hd[h.d]=h;});const tk=dkey(now);
 let c=["П","В","С","Ч","П","С","В"].map(x=>`<span>${x}</span>`).join("");
 for(let i=0;i<(first.getDay()+6)%7;i++)c+=`<b class="e"></b>`;
 let cnt=0;
 for(let d=1;d<=days;d++){const x=new Date(y,m,d),k=dkey(x),h=hd[k];if(h)cnt++;
  const cls=h?"d":"";const pl=!h&&x>now&&(x.getDay() in DMAP)?"p":"";
  c+=`<b class="${cls} ${pl} ${k===tk?"t":""}">${d}</b>`;}
 const MN=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];
 return `<div class="tile"><div class="row" style="justify-content:space-between;margin-bottom:12px;flex-wrap:nowrap">
 <button class="btn sm" onclick="calShift(-1)" aria-label="Предыдущий месяц">‹</button>
 <div style="text-align:center"><h2 style="font-size:20px">${MN[m]} ${y}</h2><span class="dim" style="font-size:12px">${cnt} из ${Math.round(days/7*3)} тренировок</span></div>
 <button class="btn sm" onclick="calShift(1)" aria-label="Следующий месяц">›</button></div>
 <div class="cal">${c}</div></div>`;}
function calShift(k){calM=new Date(calM.getFullYear(),calM.getMonth()+k,1);render();}
