<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Программа">
<meta name="theme-color" content="#1B222B">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%231B222B'/%3E%3Crect x='30' y='84' width='120' height='12' rx='6' fill='%23F2C000'/%3E%3Crect x='20' y='66' width='16' height='48' rx='5' fill='%23EDF1F4'/%3E%3Crect x='144' y='66' width='16' height='48' rx='5' fill='%23EDF1F4'/%3E%3C/svg%3E">
<title>Программа</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#1B222B;--deep:#141A21;--card:#232C37;--hi:#2B3644;--line:#354250;
--tx:#EDF1F4;--dim:#8FA0B0;--red:#C8102E;--blue:#1A6BD0;--yellow:#F2C000;--green:#12945A;--grey:#7C8A98;
--noteBg:#17222E;--noteBd:#22436E;--noteTx:#B8D6FF;--warnBg:#2A1A1D;--warnBd:#5A2630;--warnTx:#FFB3BE;
--goodBg:#152A20;--goodBd:#1D5238;--goodTx:#9BE9C0;--soft:#C6D0D9}
body.light{--bg:#F4F6F8;--deep:#FFFFFF;--card:#FFFFFF;--hi:#EEF1F4;--line:#D8DEE4;
--tx:#171C22;--dim:#5E6B78;--noteBg:#EAF2FE;--noteBd:#BBD5F5;--noteTx:#14395F;
--warnBg:#FDECEE;--warnBd:#F3C3CA;--warnTx:#7A1220;--goodBg:#E9F7EF;--goodBd:#B9E2CB;--goodTx:#0E5231;--soft:#3C4854}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font-family:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
font-size:16px;line-height:1.45;padding-bottom:calc(74px + env(safe-area-inset-bottom));transition:background .2s,color .2s}
body.big{font-size:18.5px}
body.big h1{font-size:33px}body.big h2{font-size:24px}body.big h3{font-size:20px}
body.big input,body.big .set-n{font-size:17px}
.wrap{max-width:640px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 14px 24px}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;font-weight:700;margin:0;line-height:1.1}
h1{font-size:29px}h2{font-size:21px}h3{font-size:17px}
.mono{font-family:"IBM Plex Mono",monospace}
.dim{color:var(--dim)}
.eyebrow{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;
letter-spacing:.14em;font-size:12px;color:var(--dim)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:10px;
width:100%;text-align:left;color:inherit;font:inherit}
button.tile{cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
button.tile:active{transform:scale(.99)}
button.tile:hover{background:var(--hi);border-color:var(--dim)}
.tile.ok{border-color:var(--green)}
.tag{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.05em;
padding:3px 7px;border-radius:6px;background:var(--deep);color:var(--dim);border:1px solid var(--line)}
.tag.red{color:#FF8A9B;border-color:#5A2630}.tag.blue{color:#8FC0FF;border-color:#22436E}
.tag.green{color:#7FE0AE;border-color:#1D5238}.tag.yellow{color:#FFD65E;border-color:#5E4A0A}
body.light .tag.red{color:#96131F;background:#FDECEE}body.light .tag.blue{color:#12457E;background:#EAF2FE}
body.light .tag.green{color:#0E5231;background:#E9F7EF}body.light .tag.yellow{color:#6B5200;background:#FFF6DC}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font-family:"Barlow Condensed",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.09em;
font-size:15px;border-radius:10px;padding:12px 16px;cursor:pointer;border:1px solid var(--line);
background:transparent;color:var(--dim);transition:.15s}
.btn:hover{color:var(--tx);border-color:var(--dim)}
.btn.main{background:var(--yellow);border-color:var(--yellow);color:#1A1400}
.btn.main:hover{background:#ffd21f}
.btn.wide{flex:1}.btn.sm{padding:8px 11px;font-size:13px}
.btn.on{background:var(--green);border-color:var(--green);color:#fff}
.pbar{height:4px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0 16px}
.pbar i{display:block;height:100%;background:var(--yellow);transition:width .3s}
.big-num{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:42px;line-height:1}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:9px;overflow:hidden}
.ex.ok{border-color:var(--green)}
.ex-h{padding:13px 14px;display:flex;gap:11px;align-items:flex-start;cursor:pointer}
.ex-n{width:25px;height:25px;flex:0 0 25px;border-radius:8px;display:grid;place-items:center;background:var(--deep);
border:1px solid var(--line);font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--dim)}
.ex-n.ok{background:var(--green);border-color:var(--green);color:#fff}
.ex-b{padding:12px 14px 14px;border-top:1px solid var(--line)}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin:13px 0 4px;
font-family:"Barlow Condensed",sans-serif;font-weight:700}
.txt{font-size:14px;color:var(--soft)}
.set{display:flex;gap:7px;align-items:center;margin-bottom:6px}
.set.warm input,.set.warm .set-n{opacity:.62}
.set-n{width:46px;flex:0 0 46px;font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--dim);line-height:1.15}
.set.drop .set-n{color:#D9A400}
input,select{background:var(--deep);border:1px solid var(--line);border-radius:9px;color:var(--tx);
font:inherit;font-size:15px;padding:9px;width:100%;min-width:0}
input[type=number],input.c{text-align:center}
input:focus,select:focus{outline:2px solid var(--yellow);outline-offset:1px;border-color:transparent}
.chk{width:40px;height:40px;flex:0 0 40px;border-radius:10px;border:1px solid var(--line);background:var(--deep);
cursor:pointer;display:grid;place-items:center;font-size:16px;color:var(--dim);transition:.15s}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.note{background:var(--noteBg);border:1px solid var(--noteBd);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--noteTx);margin-top:10px}
.warn{background:var(--warnBg);border:1px solid var(--warnBd);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--warnTx);margin-top:10px}
.good{background:var(--goodBg);border:1px solid var(--goodBd);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--goodTx);margin-top:10px}
.hr{height:1px;background:var(--line);margin:20px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{font-family:"Barlow Condensed",sans-serif;font-size:25px;display:block;line-height:1}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--deep);border-top:1px solid var(--line);
display:flex;z-index:60;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;color:var(--dim);font:inherit;font-size:10.5px;padding:9px 2px 8px;
cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav button.on{color:var(--yellow)}
body.light .nav button.on{color:#B07E00}
.nav svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.timer{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom));background:var(--deep);
border-top:1px solid var(--line);padding:10px 14px;display:none;z-index:55}
.timer.on{display:block}
.timer-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:12px}
.tnum{font-family:"IBM Plex Mono",monospace;font-size:26px;font-weight:500;min-width:74px;transition:.2s}
.tnum.hot{font-size:38px;color:var(--yellow)}
.tnum.over{color:#FF8A9B}
.tprog{flex:1;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.tfill{height:100%;background:var(--yellow);width:100%;transition:width 1s linear}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal span{aspect-ratio:1;display:grid;place-items:center;font-size:11.5px;border-radius:7px;
background:var(--deep);color:var(--dim);border:1px solid transparent}
.cal span.t{border-color:var(--yellow);color:var(--tx)}
.cal span.d{background:var(--green);color:#fff;border-color:var(--green)}
.cal .h{background:none;color:var(--grey);font-size:10px;aspect-ratio:auto}
.pl{font-family:"IBM Plex Mono",monospace;font-size:12px;padding:5px 9px;border-radius:7px;
background:var(--deep);border:1px solid var(--line)}
textarea{width:100%;min-height:80px;background:var(--deep);border:1px solid var(--line);border-radius:10px;
color:var(--tx);font-family:"IBM Plex Mono",monospace;font-size:11px;padding:11px;resize:vertical}
.spark{width:100%;height:52px;display:block;margin-top:8px}
.glass{width:100%;aspect-ratio:1;border-radius:9px;border:1px solid var(--line);background:var(--deep);
cursor:pointer;display:grid;place-items:center;font-size:15px;color:var(--dim)}
.glass.on{background:var(--blue);border-color:var(--blue);color:#fff}
.frow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.pill{font-family:"IBM Plex Mono",monospace;font-size:11px;padding:4px 8px;border-radius:999px;
background:var(--deep);border:1px solid var(--line);color:var(--dim)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="timer" id="timer"><div class="timer-in">
  <span class="tnum" id="tnum">1:30</span>
  <div class="tprog"><div class="tfill" id="tfill"></div></div>
  <button class="btn sm" id="tskip">Стоп</button>
</div></div>
<nav class="nav" id="nav"></nav>
<script>
const EX={
bp:{n:"Жим штанги лёжа",eq:"штанга, скамья со стойками",m:"Грудь целиком",st:"75 кг",f:0,alt:["flat_db","hammer_ch","inc_bb"],
why:"Основа силы верха тела: единственное движение, где грудь работает под действительно большим весом.",
t:"Хват на ширине плеч плюс ладонь с каждой стороны. Лопатки сведены и опущены в карман на весь подход, стопы плотно в полу. Гриф опускаешь к низу груди без отбива, локти под 45°. Жмёшь по слегка диагональной траектории назад к плечам.",
err:"Широкий хват и разведённые в стороны локти — прямой путь к боли в плече. Отбив грифа от груди. Отрыв таза от скамьи.",
feel:"Грудь должна тянуть в нижней точке. Если всё забирает передняя дельта — опусти локти ближе к корпусу и сведи лопатки сильнее."},
inc_bb:{n:"Жим штанги на наклонной 30°",eq:"штанга, наклонная скамья",m:"Верх груди",st:"55–60 кг",f:0,alt:["inc_db","hammer_ch","cross_up"],
why:"Верх груди — причина, по которой грудь выглядит плоской и висячей. Под штангой туда можно дать самый большой вес.",
t:"Угол ровно 30°, выше — работу забирает дельта. Гриф опускается к верху груди, ближе к ключицам. Лопатки сведены, локти 45°.",
err:"Слишком большой угол скамьи. Опускание грифа на середину груди вместо ключиц.",
feel:"Жжение должно идти под ключицами. Если чувствуешь только плечи — уменьшай угол."},
inc_db:{n:"Жим гантелей на наклонной 30°",eq:"гантели, регулируемая скамья",m:"Верх груди",st:"26–30 кг",f:0,alt:["inc_bb","hammer_ch","cross_up"],
why:"Гантели дают амплитуду больше штанги и грузят верх груди в растянутом положении, где мышца растёт лучше всего.",
t:"Лопатки сведены и прижаты. Локти под 45°, не разводить в стороны. Внизу опускаешь до ощутимого растяжения, вверху гантели не стукаешь и руки в замок не выпрямляешь.",
err:"Опускание гантелей слишком низко при больном плече. Стук гантелями вверху — теряется напряжение.",
feel:"В нижней точке грудь должна ощутимо тянуться."},
flat_db:{n:"Жим гантелей лёжа",eq:"гантели, скамья",m:"Середина груди",st:"30–34 кг",f:0,alt:["bp","hammer_ch","pec_deck"],
why:"Больше амплитуда, чем у штанги, и каждая сторона работает самостоятельно — уходит перекос.",
t:"Опускаешь до уровня груди, локти 45°, темп медленный. Внизу пауза без расслабления, вверху не сводишь гантели до касания.",
err:"Слишком быстрый негатив. Сведение гантелей вверху до стука.",
feel:"Напряжение по центру груди на протяжении всего подхода."},
hammer_ch:{n:"Жим в рычажном тренажёре",eq:"хаммер для груди",m:"Середина груди",st:"60–70 кг",f:1,alt:["pec_deck","flat_db","cross_dn"],
why:"Позволяет работать до полного отказа и делать дроп-сет без риска для плеча.",
t:"Рукояти на уровне середины груди, спина плотно к спинке, лопатки сведены. Негатив 3 секунды, пауза внизу без расслабления.",
err:"Слишком высокая посадка — нагрузка уходит в дельту. Помощь корпусом.",
feel:"К третьему подходу грудь должна гореть, а не плечи."},
dips:{n:"Отжимания на брусьях",eq:"брусья или гравитрон",m:"Низ груди, трицепс",st:"свой вес",f:0,alt:["dips_tri","cross_dn","hammer_ch"],
why:"Низ груди и трицепс одним движением — редкое сочетание, которое подтягивает грудь визуально вверх.",
t:"Корпус наклонён вперёд на 30°, так работает грудь. Опускаешься строго до угла 90° в локте и НЕ ниже: глубже плечо получает травмоопасную нагрузку.",
err:"Провал ниже 90° — главная причина боли в плече на брусьях. Вертикальный корпус переносит всё на трицепс.",
feel:"Растяжение по низу груди в нижней точке."},
cross_up:{n:"Сведения в кроссовере снизу вверх",eq:"кроссовер, нижние блоки",m:"Верх груди",st:"10–15 кг",f:1,alt:["pec_deck","cross_dn","inc_db"],
why:"Изоляция верха груди с постоянным напряжением — то, чего не даёт ни один жим.",
t:"Блоки внизу, корпус наклонён вперёд на 15°. Ведёшь руки по дуге снизу вверх к подбородку, кисти скрещиваются, пауза 1 секунда. Локти чуть согнуты и зафиксированы.",
err:"Сгибание и разгибание локтей превращает упражнение в жим. Слишком большой вес и раскачка корпусом.",
feel:"Сжатие в верхней внутренней части груди в точке скрещивания."},
cross_dn:{n:"Сведения в кроссовере сверху вниз",eq:"кроссовер, верхние блоки",m:"Низ и середина груди",st:"12–18 кг",f:1,alt:["pec_deck","cross_up","dips"],
why:"Другой угол — другие волокна. Добивает низ груди и держит напряжение там, где жимы его теряют.",
t:"Блоки вверху, сводишь руки перед собой на уровне пояса, в конце скрещиваешь. Пауза 1 секунда, корпус неподвижен.",
err:"Наклон корпуса вперёд по ходу подхода. Работа локтями вместо плечевого сустава.",
feel:"Сжатие по низу груди, как при позировании."},
pec_deck:{n:"Бабочка в тренажёре",eq:"тренажёр «бабочка»",m:"Грудь, добивка",st:"подбор",f:1,alt:["cross_up","cross_dn","hammer_ch"],
why:"Последнее упражнение на грудь: работаешь чисто до жжения, стабилизаторы не мешают.",
t:"Спина к спинке, локти на уровне плеч. Сводишь до касания, пауза 1 секунда, разводишь медленно до растяжения.",
err:"Слишком широкий стартовый угол при больном плече. Рывковое разведение.",
feel:"Постоянное жжение по всей груди без участия рук."},
pullup_w:{n:"Подтягивания с весом",eq:"турник, пояс",m:"Широчайшие, ширина",st:"свой вес → +5 кг",f:0,alt:["pullup_n","lat_w","lat_r"],
why:"Спина растёт от прогрессии веса так же, как грудь. Ты подтягиваешься 10+ раз — значит пора вешать пояс.",
t:"Хват шире плеч на две ладони. Из полного виса сначала опускаешь лопатки, потом тянешь локтями вниз-назад. Подбородок над перекладиной, негатив 2–3 секунды.",
err:"Раскачка корпусом и рывок. Неполное выпрямление рук внизу — теряется растяжение широчайших.",
feel:"Тяга должна ощущаться в подмышечной области и по бокам спины, а не в бицепсе."},
pullup_n:{n:"Подтягивания нейтральным хватом",eq:"турник с параллельными ручками",m:"Широчайшие, бицепс",st:"свой вес",f:0,alt:["pullup_w","lat_r","hammer_row"],
why:"Нейтральный хват мягче для плеча и сильнее включает бицепс.",
t:"Ладони смотрят друг на друга. Тянешь до касания грудью, локти вдоль корпуса. Внизу руки выпрямляешь полностью.",
err:"Подтягивание рывком за счёт ног.",feel:"Работа по низу широчайших и в бицепсе."},
db_row:{n:"Тяга гантели одной рукой",eq:"гантель, скамья",m:"Широчайшая",st:"30–36 кг",f:1,alt:["cable_row1","hammer_row","tbar"],
why:"Односторонняя работа выравнивает стороны и даёт самую длинную амплитуду для широчайшей.",
t:"Колено и одноимённая рука на скамье, спина параллельна полу и нейтральна. Три точки опоры снимают нагрузку с поясницы. Тянешь к поясу, локоть вдоль корпуса, вверху пауза 1 секунда, внизу полное растяжение.",
err:"Скручивание корпуса, чтобы дотянуть вес. Тяга локтем в сторону вместо назад. Круглая спина.",
feel:"Растяжение внизу и сжатие лопатки вверху. Бицепс не должен забивать раньше спины."},
tbar:{n:"Т-гриф с упором в грудь",eq:"Т-гриф с платформой",m:"Толщина спины",st:"40–50 кг",f:1,alt:["hammer_row","seated_row","db_row"],
why:"Самая тяжёлая тяга, которую можно делать без нагрузки на поясницу.",
t:"Грудь на упоре, ноги устойчиво. Тянешь к низу груди, локти вдоль корпуса, лопатки сводишь до упора.",

 return Math.max(1,Math.floor(d/7)+1);}

function lastLog(id){const l=DB.log[id];return l&&l.length?l[l.length-1]:null;}

 const k=Math.round(tdee*0.78/10)*10,p=Math.round(w*1.85/5)*5,f=Math.round(w*0.8/5)*5;
 return{k,p,f,c:Math.round((k-p*4-f*9)/4)};}

function suggestion(it){const l=lastLog(it.id);if(!l)return null;
 const w=l.sets.filter(s=>!s.warm&&!s.drop);if(!w.length)return null;

 return null;}

function exBlock(it,n,items,E){
 const e=E[it.id],st=session.sets[it.id]||{},prev=lastLog(it.id),sg=suggestion(it),o=open.has(n);
 const pair=it.ss&&items[n+1]?items[n+1]:null;
 let rows="";
 for(let i=0;i<(it.w||0);i++)rows+=setRow(it,"w"+i,"разм "+(i+1),true,false,prev,i);
 for(let i=0;i<it.s;i++)rows+=setRow(it,"s"+i,"подход "+(i+1),false,false,prev,i);
 if(it.drop)rows+=setRow(it,"d0","дроп",false,true,prev,0);
 return `<div class="ex ${st.fin?"ok":""}${st.skip?" ":""}">
 <div class="ex-h" onclick="tg(${n})"><span class="ex-n ${st.fin?"ok":""}">${n+1}</span>
 <div style="flex:1"><h3>${e.n}${st.skip?' <span class="tag">пропущено</span>':""}</h3>
 <div class="dim mono" style="font-size:11.5px;margin-top:3px">${it.s}×${it.r} · ${it.rest} сек${it.drop?" · дроп":""}${pair?" · суперсет":""}</div>
 ${prev?`<div class="dim mono" style="font-size:11px;margin-top:3px">прошлый раз: ${prev.sets.filter(s=>!s.warm).map(s=>`${s.w||"?"}×${s.r||"?"}`).join(" · ")}</div>`:""}
 </div><span class="dim">${o?"▴":"▾"}</span></div>
 ${o?`<div class="ex-b">
 ${sg?`<div class="${sg.k==="up"?"good":"warn"}">${sg.t}</div>`:""}
 ${pair?`<div class="note">Суперсет с «${E[pair.id].n}»: подход здесь, сразу подход там, отдых только после круга.</div>`:""}
 <div style="margin:12px 0 6px">${rows}</div>
 <div class="row">${prev?`<button class="btn sm" onclick="repPrev('${it.id}')">Повторить прошлый</button>`:""}
 <button class="btn sm" onclick="plate('${it.id}',${n})">Блины</button>
 <button class="btn sm" onclick="alts('${it.id}',${n})">Замены</button>
 <button class="btn sm" onclick="noteUI('${it.id}',${n})">Заметка</button>
 <button class="btn sm" onclick="skipEx('${it.id}',${n})">Пропустить</button></div>
 <div id="ex${n}"></div>
 ${DB.notes[it.id]?`<div class="note"><b>Твоя заметка:</b> ${DB.notes[it.id]}</div>`:""}
 ${e.f?`<div class="good">Последний подход — до отказа.${it.drop?" Затем дроп-сет: минус половина веса, без паузы, до жжения.":""}</div>`
      :`<div class="warn">До отказа НЕ работаешь: свободный вес, страхующего нет. Останавливаешься за повтор до.</div>`}
 <div class="lbl">Зачем это упражнение</div><div class="txt">${e.why}</div>
 <div class="lbl">Техника</div><div class="txt">${e.t}</div>
 <div class="lbl">Частые ошибки</div><div class="txt">${e.err||"—"}</div>
 <div class="lbl">Как понять, что работает нужная мышца</div><div class="txt">${e.feel||"—"}</div>
 <div class="lbl">Оборудование · цель · старт</div><div class="txt">${e.eq} · ${e.m} · ${e.st}</div>
 <button class="btn sm" style="margin-top:12px" onclick="finEx('${it.id}',${n})">Упражнение сделано</button></div>`:""}</div>`;}
function setRow(it,k,lbl,warm,drop,prev,i){
 const st=(session.sets[it.id]||{})[k]||{},pw=prev&&prev.sets.filter(s=>!s.warm)[i];
 return `<div class="set ${warm?"warm":""} ${drop?"drop":""}"><span class="set-n">${lbl}</span>
 <input type="number" inputmode="decimal" placeholder="${warm?"лёгкий":(pw&&pw.w)||"кг"}" value="${st.w||""}" onchange="setV('${it.id}','${k}','w',this.value)">
 <input type="number" inputmode="numeric" placeholder="повт" value="${st.r||""}" onchange="setV('${it.id}','${k}','r',this.value)">
 <button class="chk ${st.ok?"on":""}" onclick="tick('${it.id}','${k}',${it.rest})">✓</button></div>`;}
function setV(id,k,f,v){session.sets[id]=session.sets[id]||{};session.sets[id][k]=session.sets[id][k]||{};session.sets[id][k][f]=v;}
function tick(id,k,rest){session.sets[id]=session.sets[id]||{};session.sets[id][k]=session.sets[id][k]||{};
 const c=session.sets[id][k];c.ok=!c.ok;if(c.ok){startTimer(rest);if(navigator.vibrate)navigator.vibrate(35);}render();}
function tg(n){open.has(n)?open.delete(n):open.add(n);render();}
function repPrev(id){const p=lastLog(id);if(!p)return;session.sets[id]=session.sets[id]||{};
 p.sets.filter(s=>!s.warm&&!s.drop).forEach((s,i)=>{session.sets[id]["s"+i]={w:s.w,r:s.r};});render();}
function plate(id,n){const st=session.sets[id]||{};let t=0;
 for(const k in st)if(k[0]==="s"&&st[k].w){t=+st[k].w;break;}
 const el=document.getElementById("ex"+n);
 if(!t){el.innerHTML='<div class="note">Впиши вес в рабочий подход — посчитаю блины.</div>';return;}
 let per=(t-20)/2,out=[],rest=per;
 [25,20,15,10,5,2.5,1.25].forEach(p=>{while(rest>=p-0.01){out.push(p);rest=+(rest-p).toFixed(2);}});
 el.innerHTML=per<=0?`<div class="note">${t} кг меньше грифа (20 кг). Бери гантели или лёгкий гриф.</div>`:
 `<div class="note">На ${t} кг: гриф 20 кг плюс с каждой стороны
 <div class="row" style="margin-top:8px">${out.map(p=>`<span class="pl">${p}</span>`).join("")}</div>
 ${rest>0.01?`<div style="margin-top:6px">Не хватает ${rest} кг — округли до ${t-rest*2} кг.</div>`:""}</div>`;}
function alts(id,n){const E=EXALL(),e=E[id];
 document.getElementById("ex"+n).innerHTML=`<div class="note"><b>Замены на ту же мышцу:</b>
 ${(e.alt||[]).map(a=>`<div style="margin-top:7px">• <b>${E[a].n}</b> — ${E[a].eq}</div>`).join("")||"нет"}
 <div style="margin-top:8px">Тренажёр занят или больно — бери любую с тем же числом подходов и повторов.</div></div>`;}
function noteUI(id,n){document.getElementById("ex"+n).innerHTML=
 `<div class="note"><input type="text" id="nt" placeholder="Например: третья дырка на тренажёре" value="${DB.notes[id]||""}">
 <button class="btn sm" style="margin-top:8px" onclick="saveNote('${id}')">Сохранить</button></div>`;}
function saveNote(id){const v=document.getElementById("nt").value.trim();
 if(v)DB.notes[id]=v;else delete DB.notes[id];save();render();}
function skipEx(id,n){const r=prompt("Почему пропускаешь? (занят тренажёр, боль, нет времени)");
 session.sets[id]=session.sets[id]||{};session.sets[id].skip=r||"без причины";session.sets[id].fin=true;
 if(r&&/бол/i.test(r)){DB.pain.push({d:today(),ex:id,r});save();}
 open.delete(n);render();}
function finEx(id,n){const st=session.sets[id]||{};st.fin=true;session.sets[id]=st;
 if(!DB.view&&!st.skip){const it=itemsFor(session.di).find(x=>x.id===id),arr=[];
  for(let i=0;i<(it.w||0);i++){const c=st["w"+i];if(c&&(c.w||c.r))arr.push({w:c.w,r:c.r,warm:1});}
  for(let i=0;i<it.s;i++){const c=st["s"+i];if(c&&(c.w||c.r))arr.push({w:c.w,r:c.r});}
  if(st.d0&&(st.d0.w||st.d0.r))arr.push({w:st.d0.w,r:st.d0.r,drop:1});
  if(arr.length){DB.log[id]=DB.log[id]||[];DB.log[id].push({d:today(),sets:arr});
   const wk=arr.filter(s=>!s.warm&&!s.drop);
   DB.fail[id]=(wk.length&&wk.every(s=>+s.r<it.lo))?(DB.fail[id]||0)+1:0;save();}}
 open.delete(n);render();}
function quitW(){stopTimer();stopClock();session=null;render();}
function finishW(){const di=session.di,w=weekNow(),it=itemsFor(di),E=EXALL();
 let ton=0,prs=[];
 it.forEach(x=>{const st=session.sets[x.id]||{};
  Object.keys(st).forEach(k=>{const c=st[k];if(c&&c.w&&c.r)ton+=(+c.w)*(+c.r);});
  const b=bestOf(x.id);let cur=0;Object.keys(st).forEach(k=>{if(st[k]&&+st[k].w>cur)cur=+st[k].w;});
  if(cur>b&&b>0)prs.push(E[x.id].n+" — "+cur+" кг");});
 const dur=Math.round((Date.now()-session.t0)/60000);
 const prev=DB.hist.filter(h=>h.day===di).slice(-1)[0];
 stopTimer();stopClock();
 const rpe=prompt("Насколько тяжело далась тренировка? 1–10");
 if(!DB.view){DB.done[`${w}-${di}`]=today();
  DB.hist.push({d:today(),day:di,dur,ton,prs:prs.length,rpe:rpe||"",mood:session.mood});save();}
 app.innerHTML=`<div class="head"><div><div class="eyebrow">Готово</div><h1>Тренировка закрыта</h1></div></div>
 <div class="grid3" style="margin-bottom:12px">
 <div class="stat"><b>${dur}</b><span class="dim" style="font-size:12px">минут</span></div>
 <div class="stat"><b>${Math.round(ton/1000*10)/10}т</b><span class="dim" style="font-size:12px">тоннаж</span></div>
 <div class="stat"><b>${prs.length}</b><span class="dim" style="font-size:12px">рекордов</span></div></div>
 ${prev?`<div class="note">Прошлый раз этот день: ${prev.dur} мин, ${Math.round(prev.ton/1000*10)/10} т. Сейчас ${ton>prev.ton?"больше на "+Math.round((ton-prev.ton)/1000*10)/10+" т":"меньше на "+Math.round((prev.ton-ton)/1000*10)/10+" т"}.</div>`:""}
 ${prs.length?`<div class="good"><b>Новые рекорды:</b><br>${prs.join("<br>")}</div>`:""}
 <div class="note">Ужин через час: открой вкладку «Еда» и добавь приём одной кнопкой.</div>
 <button class="btn main" style="width:100%;margin-top:16px" onclick="session=null;render()">На главную</button>`;
 session=null;}

let tId=null,tLeft=0,tTot=0,over=0,cId=null;
const tEl=document.getElementById("timer"),tNum=document.getElementById("tnum"),tFill=document.getElementById("tfill");
document.getElementById("tskip").onclick=stopTimer;
function startTimer(s){stopTimer();tLeft=s;tTot=s;over=0;tEl.classList.add("on");paint();
 tId=setInterval(()=>{tLeft--;if(tLeft<0)over++;paint();},1000);}
function paint(){if(tLeft>=0){tNum.textContent=`${Math.floor(tLeft/60)}:${String(tLeft%60).padStart(2,"0")}`;
 tNum.className="tnum"+(tLeft<=10?" hot":"");tFill.style.width=(tLeft/tTot*100)+"%";}
 else{tNum.textContent=`+${Math.floor(over/60)}:${String(over%60).padStart(2,"0")}`;tNum.className="tnum over";tFill.style.width="0%";}}
function stopTimer(){if(tId)clearInterval(tId);tId=null;tEl.classList.remove("on");}
function startClock(){stopClock();cId=setInterval(()=>{const el=document.getElementById("clock");
 if(!el||!session){stopClock();return;}const s=Math.floor((Date.now()-session.t0)/1000);
 el.textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;},1000);}
function stopClock(){if(cId)clearInterval(cId);cId=null;}

function calc(list){let k=0,p=0,f=0,c=0;
 (list||[]).forEach(([id,g])=>{const x=F[id];if(!x)return;const m=x.unit?g:g/100;
  k+=x.k*m;p+=x.p*m;f+=x.f*m;c+=x.c*m;});
 return{k:Math.round(k),p:Math.round(p),f:Math.round(f),c:Math.round(c)};}
function dayFood(){const d=today();let f=DB.food[d];
 if(Array.isArray(f)){f={0:f.slice(),1:[],2:[],3:[]};DB.food[d]=f;save();}
 if(!f||typeof f!=="object"){f={0:[],1:[],2:[],3:[]};DB.food[d]=f;}
 [0,1,2,3].forEach(i=>{if(!Array.isArray(f[i]))f[i]=[];});
 return f;}

 `<button class="glass ${i<wat?"on":""}" onclick="setWater(${i+1})">${i+1}</button>`).join("")}</div>
 <div class="hr"></div>
 <h3>Чек-лист дня</h3>
 ${[["p","Набрал белок"],["w","Выпил воду"],["s","Прошёл 8 000 шагов"],["sl","Спал 7 часов"]].map(([k,l])=>
 `<button class="tile" style="padding:12px" onclick="tCheck('${k}')"><div class="row">
 <span class="chk ${ch[k]?"on":""}" style="width:28px;height:28px;flex:0 0 28px;font-size:13px">✓</span>

 :'<div class="dim" style="font-size:14px">Пока ничего не добавлено.</div>'}

function tgMeal(i){mealOpen=mealOpen===i?null:i;if(sub&&sub.indexOf("add")===0)sub=null;render();}
function loadMeal(i){dayFood()[i]=MENUS[DB.menu].m[i].map(x=>x.slice());save();render();}
function clearMeal(i){dayFood()[i]=[];save();render();}
function foodRows(ids,meal){return ids.map(id=>`<div class="frow"><span style="flex:1;font-size:14px">${F[id].n}</span>
 <span class="dim mono" style="font-size:11px">${F[id].k}</span>
 <input type="number" class="c" id="g_${id}" placeholder="${F[id].unit?"шт":"г"}" style="width:66px;padding:6px">

function tCheck(k){const d=today();DB.check[d]=DB.check[d]||{};DB.check[d][k]=!DB.check[d][k];save();render();}

  const amount=x.unit?g:Math.round(g*(x.raw||1));agg[id]=(agg[id]||0)+amount*7;});
 return `<div class="tile"><b style="font-size:15px">Покупки на неделю — меню «${MENUS[DB.menu].n}»</b>
 <div class="dim" style="font-size:12.5px;margin:6px 0 10px">Пересчитано в СЫРОЙ вес: столько нужно купить, чтобы получить готовые порции из меню.</div>
 ${Object.keys(agg).map(id=>{const x=F[id],a=agg[id];
 const disp=x.buy==="г"&&a>=1000?(Math.round(a/100)/10)+" кг":a+" "+x.buy;
 return `<div class="frow"><span style="flex:1;font-size:14px">${x.n.split(",")[0]}</span>
 <span class="mono dim" style="font-size:12.5px">${disp}</span></div>`;}).join("")}
 <div class="note">Готовь два раза в неделю: воскресенье и среда. Курица в духовке 35 минут, крупа 15–18 минут, салат нарезать без масла — иначе потечёт.</div></div>`;}

/* ================= ПРОГРЕСС ================= */
function spark(v,c){if(v.length<2)return"";const w=300,h=52,mn=Math.min(...v),mx=Math.max(...v),r=mx-mn||1;
 return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${
 v.map((x,i)=>`${i/(v.length-1)*w},${h-4-((x-mn)/r)*(h-10)}`).join(" ")}" fill="none" stroke="${c}" stroke-width="2"/></svg>`;}
function forecast(){if(DB.bw.length<2)return null;
 const f=DB.bw[0],l=DB.bw[DB.bw.length-1];
 const days=(new Date(l.d)-new Date(f.d))/864e5;if(days<7)return null;
 const rate=(f.w-l.w)/days;if(rate<=0)return"Вес не снижается. Проверь: считаешь ли ты всё, что съедаешь, и попадаешь ли в норму белка.";
 const need=(l.w-95)/rate;if(need<=0)return"Цель 95 кг достигнута.";
 const dt=new Date(Date.now()+need*864e5);
 return `При текущем темпе ${Math.round(rate*7*100)/100} кг в неделю до 95 кг осталось ${Math.round(need)} дней — примерно ${dt.toLocaleDateString("ru-RU")}.`;}
function vProg(){const ids=Object.keys(DB.log),b=DB.bw.map(x=>x.w),E=EXALL();
 app.innerHTML=banner()+`<div class="head"><div><div class="eyebrow">Прогресс</div><h1>Цифры</h1></div></div>
 <div class="grid3" style="margin-bottom:12px">
 <div class="stat"><b>${DB.hist.length}</b><span class="dim" style="font-size:12px">тренировок</span></div>
 <div class="stat"><b>${weekNow()}</b><span class="dim" style="font-size:12px">неделя</span></div>
 <div class="stat"><b>${DB.hist.reduce((a,h)=>a+(h.prs||0),0)}</b><span class="dim" style="font-size:12px">рекордов</span></div></div>
 <div class="tile"><b style="font-size:15px">Вес тела</b>
 <div class="row" style="margin-top:8px"><input type="number" id="bwIn" placeholder="кг сегодня" style="flex:1">
 <button class="btn sm" onclick="addBw()">Записать</button></div>
 ${b.length?`<div class="dim mono" style="font-size:12px;margin-top:8px">${b[0]} → ${b[b.length-1]} кг (${(b[b.length-1]-b[0]).toFixed(1)}) · цель 95</div>${spark(b,"#F2C000")}`:""}
 ${forecast()?`<div class="note">${forecast()}</div>`:""}</div>
 ${DB.hist.length&&DB.hist.length%5===0?`<div class="warn">Пройдено ${DB.hist.length} тренировок. Зайди в «Ещё» → «Резервная копия» и сохрани текст в заметки телефона — это займёт полминуты и застрахует весь дневник.</div>`:""}
 <div class="tile"><b style="font-size:15px">Здоровье</b>
 <div class="row" style="margin-top:8px"><input type="number" id="hSleep" placeholder="сон, ч" style="width:88px">
 <input type="text" id="hBp" placeholder="давление" style="width:110px">
 <input type="number" id="hCar" placeholder="кардио, мин" style="width:112px">
 <button class="btn sm" onclick="addHealth()">+</button></div>
 ${DB.health.slice(-4).reverse().map(h=>`<div class="dim mono" style="font-size:11.5px;margin-top:6px">${h.d}: сон ${h.s||"—"} ч · давление ${h.b||"—"} · кардио ${h.c||"—"} мин</div>`).join("")}
 ${remind()}</div>
 <h3 style="margin:16px 0 8px">Рост весов</h3>
 ${ids.length?ids.map(id=>{const l=DB.log[id],mx=l.map(s=>Math.max(...s.sets.filter(x=>!x.warm).map(x=>+x.w||0)));
 const d=mx[mx.length-1]-mx[0];
 return `<div class="tile"><div class="row" style="justify-content:space-between">
 <b style="font-size:14.5px">${E[id]?E[id].n:id}</b>
 ${d>0?`<span class="tag green">+${d} кг</span>`:d<0?`<span class="tag red">${d} кг</span>`:'<span class="tag">—</span>'}</div>
 <div class="dim mono" style="font-size:11.5px;margin-top:5px">${l.length} записей · ${l[l.length-1].d}</div>
 ${spark(mx,"#7FE0AE")}</div>`;}).join(""):'<p class="dim">Данные появятся после первой тренировки.</p>'}
 ${DB.pain.length?`<h3 style="margin:16px 0 8px">История боли</h3>
 ${DB.pain.slice().reverse().map(p=>`<div class="tile" style="padding:11px"><span class="mono dim" style="font-size:11.5px">${p.d}</span>
 <div style="font-size:14px">${(EXALL()[p.ex]||{n:p.ex}).n} — ${p.r}</div></div>`).join("")}`:""}
 ${DB.hist.length?`<h3 style="margin:16px 0 8px">История тренировок</h3>
 ${DB.hist.slice().reverse().map(h=>`<div class="tile" style="padding:12px"><div class="row" style="justify-content:space-between">
 <b style="font-size:14px">${DAYS[h.day].t}</b><span class="tag mono">${h.d}</span></div>
 <div class="dim mono" style="font-size:11.5px;margin-top:5px">${h.dur} мин · ${Math.round(h.ton/1000*10)/10} т${h.rpe?" · тяжесть "+h.rpe+"/10":""}</div></div>`).join("")}`:""}`;}
function addBw(){const v=document.getElementById("bwIn").value;if(!v)return;DB.bw.push({d:today(),w:+v});save();render();}
function addHealth(){const s=document.getElementById("hSleep").value,b=document.getElementById("hBp").value,c=document.getElementById("hCar").value;
 if(!s&&!b&&!c)return;DB.health.push({d:today(),s,b,c});save();render();}
function remind(){if(!DB.start)return"";
 const d=Math.floor((Date.now()-new Date(DB.start+"T00:00:00").getTime())/864e5);
 let out="";
 if(d>0&&d%30<3)out+='<div class="note">Прошёл месяц — сделай фото прогресса. В приложении оно не хранится, снимай в галерею при одном свете и в одной позе.</div>';
 if(d>85)out+='<div class="warn">Три месяца с начала: пора сдать общий анализ крови с гематокритом и липидограмму. Гематокрит выше 52 % — сразу к врачу.</div>';
 return out;}

/* ================= СПРАВКА ================= */
function vRef(){const E=EXALL();
 const ids=Object.keys(E).filter(id=>(E[id].n+" "+E[id].m+" "+E[id].eq).toLowerCase().includes(q.toLowerCase()));
 app.innerHTML=`<div class="head"><div><div class="eyebrow">Справка</div><h1>${sub==="pain"?"Если болит":sub==="why"?"Почему так":"Упражнения"}</h1></div></div>
 <div class="row" style="margin-bottom:12px">
 <button class="btn sm ${!sub?"on":""}" onclick="sub=null;render()">Упражнения</button>
 <button class="btn sm ${sub==="pain"?"on":""}" onclick="sub='pain';render()">Если болит</button>
 <button class="btn sm ${sub==="why"?"on":""}" onclick="sub='why';render()">Почему так</button></div>
 ${sub==="pain"?PAIN.map(([z,a,b,c])=>`<div class="tile"><h3>${z}</h3>
  <div class="txt" style="margin-top:8px">${a}</div><div class="warn">${b}</div><div class="note">${c}</div></div>`).join("")
 :sub==="why"?WHY.map(([n,t])=>`<div class="tile"><b style="font-size:15px">${n}</b><div class="txt" style="margin-top:6px">${t}</div></div>`).join("")
 :`<input type="text" placeholder="Поиск: жим, спина, гантели…" value="${q}" oninput="q=this.value;render()" style="margin-bottom:12px">
 ${ids.length?ids.map(id=>{const e=E[id];return `<div class="ex"><div class="ex-h" onclick="tgR('${id}')">
 <span class="ex-n">·</span><div style="flex:1"><h3>${e.n}</h3>
 <div class="dim" style="font-size:12.5px;margin-top:2px">${e.m} · ${e.eq}</div></div><span class="dim">▾</span></div>
 <div class="ex-b" id="r_${id}" style="display:none">
 <div class="lbl">Зачем</div><div class="txt">${e.why}</div>
 <div class="lbl">Техника</div><div class="txt">${e.t}</div>
 <div class="lbl">Частые ошибки</div><div class="txt">${e.err||"—"}</div>
 <div class="lbl">Как понять, что работает мышца</div><div class="txt">${e.feel||"—"}</div>
 <div class="lbl">Замены</div><div class="txt">${(e.alt||[]).map(a=>E[a].n).join(" · ")||"—"}</div></div></div>`;}).join(""):'<p class="dim">Ничего не найдено.</p>'}
 <div class="hr"></div><h3>Словарь</h3>
 ${GLOSS.map(([k,v])=>`<div class="tile" style="padding:13px"><b style="font-size:14.5px">${k}</b>
 <div class="txt" style="margin-top:5px">${v}</div></div>`).join("")}`}`;}
function tgR(id){const e=document.getElementById("r_"+id);e.style.display=e.style.display==="none"?"block":"none";}

/* ================= ЕЩЁ ================= */
function vMore(){
 app.innerHTML=banner()+`<div class="head"><div><div class="eyebrow">Настройки и данные</div><h1>Ещё</h1></div></div>
 <div class="tile"><b style="font-size:15px">Вид</b>
 <div class="row" style="margin-top:9px">
 <button class="btn sm ${DB.theme==="dark"?"on":""}" onclick="setTheme('dark')">Тёмная</button>
 <button class="btn sm ${DB.theme==="light"?"on":""}" onclick="setTheme('light')">Светлая</button>
 <button class="btn sm ${DB.big?"on":""}" onclick="DB.big=!DB.big;save();render()">Крупный шрифт</button></div></div>
 <div class="tile"><b style="font-size:15px">Пауза на отпуск</b>
 <div class="txt" style="margin-top:6px">Неделя цикла перестаёт расти. Вернёшься — продолжишь с того же места.</div>
 <button class="btn sm ${DB.pause?"on":""}" style="margin-top:9px" onclick="togglePause()">${DB.pause?"Пауза включена":"Включить паузу"}</button></div>
 <div class="tile"><b style="font-size:15px">Своё упражнение</b>
 <div class="row" style="margin-top:9px"><input type="text" id="cn" placeholder="Название" style="flex:1"></div>
 <div class="row" style="margin-top:7px"><input type="text" id="cm" placeholder="Мышца" style="flex:1">
 <button class="btn sm" onclick="addCustom()">Добавить</button></div>
 <div class="dim" style="font-size:12.5px;margin-top:7px">Появится в справочнике и в списке замен.</div></div>
 <div class="tile"><b style="font-size:15px">Данные</b>
 <div class="note" style="margin:8px 0 0">Раз в пару недель жми «Резервная копия» и вставляй текст в «Заметки». Это единственная страховка: данные живут внутри Claude, и если что-то случится с артефактом, восстановить получится только из этой копии.</div>
 <div class="row" style="margin-top:9px"><button class="btn sm" onclick="expTxt()">Скопировать текстом</button>
 <button class="btn sm" onclick="bkp()">Резервная копия</button>
 <button class="btn sm" onclick="rstUI()">Восстановить</button></div>
 <div id="box" style="margin-top:10px"></div>
 <div class="row" style="margin-top:12px"><button class="btn sm" onclick="wipe('hist')">Сброс истории</button>
 <button class="btn sm" onclick="wipe('log')">Сброс весов</button>
 <button class="btn sm" onclick="wipe('food')">Сброс питания</button></div></div>
 <div class="tile"><b style="font-size:15px">Ярлык на экран айфона</b>
 <div class="txt" style="margin-top:6px">Открой этот чат в Safari, нажми «Поделиться», затем «На экран «Домой». Иконка со штангой уже внутри файла. Данные живут внутри Claude: скачанный отдельно файл откроется, но дневник вести не будет. Раз в месяц делай резервную копию и храни текст в заметках.</div></div>
 <div class="tile"><b style="font-size:15px">Если пропустил неделю</b>
 <div class="txt" style="margin-top:6px">Продолжаешь как ни в чём не бывало — так ты и выбрал. Первую тренировку после перерыва сделай с весами на 10 % ниже: это не откат, а страховка от травмы на непрогретых связках.</div></div>`;}
function setTheme(t){DB.theme=t;save();render();}
function togglePause(){DB.pause=!DB.pause;
 if(DB.pause)DB.pauseAt=Date.now();
 else if(DB.pauseAt){DB.pauseDays=(DB.pauseDays||0)+Math.floor((Date.now()-DB.pauseAt)/864e5);DB.pauseAt=null;}
 save();render();}
function addCustom(){const n=document.getElementById("cn").value.trim(),m=document.getElementById("cm").value.trim();
 if(!n)return;const id="my_"+Date.now();
 DB.custom[id]={n,eq:"своё",m:m||"—",st:"подбор",f:1,alt:[],why:"Добавлено тобой.",t:"Техника на твоё усмотрение.",err:"—",feel:"—"};
 save();render();}
function expTxt(){let t="ДНЕВНИК\nСтарт: "+(DB.start||"—")+"\n\nВЕС\n";
 DB.bw.forEach(x=>t+=x.d+" — "+x.w+" кг\n");
 t+="\nТРЕНИРОВКИ\n";DB.hist.forEach(h=>t+=`${h.d} ${DAYS[h.day].t} — ${h.dur} мин, ${Math.round(h.ton/1000*10)/10} т\n`);
 t+="\nУПРАЖНЕНИЯ\n";const E=EXALL();
 Object.keys(DB.log).forEach(id=>{t+="\n"+(E[id]?E[id].n:id)+"\n";
  DB.log[id].forEach(s=>t+="  "+s.d+": "+s.sets.map(x=>`${x.w||"?"}×${x.r||"?"}${x.warm?" (разм)":x.drop?" (дроп)":""}`).join(", ")+"\n");});
 box(t);}
function bkp(){box(JSON.stringify(DB));}
function box(t){document.getElementById("box").innerHTML=`<textarea readonly id="bx">${t.replace(/</g,"&lt;")}</textarea>
 <button class="btn sm" style="margin-top:8px" onclick="cp()">Скопировать</button>`;}
function cp(){const t=document.getElementById("bx");t.focus();t.select();
 try{navigator.clipboard?navigator.clipboard.writeText(t.value):document.execCommand("copy");}catch(e){document.execCommand("copy");}}
function rstUI(){document.getElementById("box").innerHTML=`<textarea id="rs" placeholder="Вставь резервную копию"></textarea>
 <button class="btn sm" style="margin-top:8px" onclick="doRst()">Восстановить</button>`;}
function doRst(){try{const d=JSON.parse(document.getElementById("rs").value);
 if(d&&typeof d==="object"){DB=Object.assign(DB,d);save();render();}}catch(e){alert("Не похоже на резервную копию");}}
function wipe(k){if(!confirm("Удалить эти данные?"))return;
 if(k==="hist"){DB.hist=[];DB.done={};}if(k==="log"){DB.log={};DB.fail={};}
 if(k==="food"){DB.food={};DB.water={};DB.check={};}save();render();}

["setTab","openDay","tg","tick","setV","finEx","quitW","finishW","repPrev","plate","alts","noteUI","saveNote",
"skipEx","addBw","startProg","setMood","setMenu","tgMeal","loadMeal","clearMeal","fList","addF","editG","delG","clearDay","setWater","tCheck",
"expTxt","bkp","rstUI","doRst","wipe","cp","tgR","setTheme","togglePause","addCustom","addHealth","startTimer"]
.forEach(f=>window[f]=eval(f));
load().then(render);
</script>
